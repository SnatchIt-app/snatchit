# Migrations guard — protects the append-only migration ledger.
#
# Runs only when a PR touches supabase/migrations/**. Two invariants:
#   1. Immutability: a migration that already exists on the base branch must
#      NOT be modified, deleted, or renamed. Applied migrations are history —
#      changing one silently diverges every environment that already ran it.
#   2. Monotonic ordering: newly-added migrations must sort AFTER the latest
#      existing migration of the same naming scheme (no back-dating / inserting
#      before an already-applied version), and version prefixes must be unique.
#
# The repo uses two schemes side by side: zero-padded sequence (NNN_, e.g.
# 067_) and 14-digit timestamps (YYYYMMDDHHMMSS_). The check is scheme-aware so
# a new 068_ is compared against the max sequence version, and a new timestamp
# against the max timestamp version. Both prefix styles sort correctly with a
# plain lexicographic compare within their own scheme.
name: Migrations guard

on:
  pull_request:
    paths:
      - "supabase/migrations/**"

permissions:
  contents: read

jobs:
  guard:
    name: Immutability + ordering
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout (full history)
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          fetch-depth: 0

      - name: Check migrations
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          set -euo pipefail
          DIR="supabase/migrations"
          fail=0
          # Per-run state file. MUST be cleared at step start: if it survives (or is
          # pre-seeded), its contents drop out of `added_files` and the prefix/monotonic
          # checks silently report "No newly-added migrations" — a real bypass.
          # Scoped to RUNNER_TEMP so it cannot collide with anything else on the host.
          RENAME_TARGETS_FILE="${RUNNER_TEMP:-/tmp}/applied_rename_targets"
          rm -f "$RENAME_TARGETS_FILE"

          # ==================================================================
          # ONE-TIME SCHEME-B NORMALIZATION EXCEPTION — REMOVE AFTER LEDGER REPAIR
          # ------------------------------------------------------------------
          # Historical migration versions carried letter suffixes (055b, 066a, …).
          # A letter version cannot be parsed by the Supabase CLI, and the numeric
          # fix alone (055 -> 0551) leaves `055` as a PREFIX of `0551`, whose
          # ordering then depends on CLI implementation details. Scheme B renames
          # the letter files AND their numeric parents so that no version is a
          # prefix of another and filename order == version order under any tool.
          #
          # This allowlist permits EXACTLY these 16 renames, and ONLY as pure
          # content-identical (R100) renames. Everything else stays forbidden.
          # PR "restore strict append-only guard" deletes this block verbatim.
          # ==================================================================
          ALLOWED_RENAMES="
          023_user_reports_and_blocks.sql|0230_user_reports_and_blocks.sql
          023b_set_updated_at_helper.sql|0231_set_updated_at_helper.sql
          055_transfer_state_guard.sql|0550_transfer_state_guard.sql
          055b_transfer_guard_bypass_for_remaining_writers.sql|0551_transfer_guard_bypass_for_remaining_writers.sql
          055c_revoke_anon_public_on_listing_rpcs.sql|0552_revoke_anon_public_on_listing_rpcs.sql
          055d_fix_mark_transfer_sent_overload_ambiguity.sql|0553_fix_mark_transfer_sent_overload_ambiguity.sql
          056a_transfer_writer_rpcs.sql|0561_transfer_writer_rpcs.sql
          056b_remove_transfer_guard_service_role_exemption.sql|0562_remove_transfer_guard_service_role_exemption.sql
          056c_scope_transfer_guard_bypass_to_function.sql|0563_scope_transfer_guard_bypass_to_function.sql
          056d_record_transfer_payout_refuses_disputed.sql|0564_record_transfer_payout_refuses_disputed.sql
          059_strict_auth_on_listing_checkout_rpcs.sql|0590_strict_auth_on_listing_checkout_rpcs.sql
          059b_strict_auth_ensure_transfer_exists.sql|0591_strict_auth_ensure_transfer_exists.sql
          060_auth_password_change_notifications.sql|0600_auth_password_change_notifications.sql
          060b_fix_sweep_query_destination.sql|0601_fix_sweep_query_destination.sql
          066_pin_search_path_definer_functions.sql|0660_pin_search_path_definer_functions.sql
          066a_vendor_out_of_band_functions.sql|0661_vendor_out_of_band_functions.sql
          "

          # --- 1. Immutability, verified by BLOB HASH (not git rename heuristics) ---
          # Rename detection is a heuristic: a rename that also edits content can be
          # reported as R98 and slip past a --diff-filter=MD check while ALSO not
          # being an exact rename. So we disable rename detection entirely and
          # compare blob hashes: identical hash == provably identical SQL.
          echo "== Immutability check (base $BASE_SHA -> HEAD) =="

          mod="$(git diff --no-renames --diff-filter=M --name-only "$BASE_SHA" HEAD -- "$DIR" || true)"
          if [ -n "$mod" ]; then
            echo "::error::Existing migration files were modified. Migrations are append-only:"
            echo "$mod" | sed 's/^/  - /'
            fail=1
          else
            echo "OK: no existing migration content was modified."
          fi

          del="$(git diff --no-renames --diff-filter=D --name-only "$BASE_SHA" HEAD -- "$DIR" || true)"
          if [ -n "$del" ]; then
            while read -r f; do
              [ -n "$f" ] || continue
              ob="$(basename "$f")"
              nb="$(printf '%s\n' "$ALLOWED_RENAMES" | tr -d ' ' | awk -F'|' -v o="$ob" 'NF==2 && $1==o {print $2}')"
              if [ -z "$nb" ]; then
                echo "::error::Existing migration deleted (or renamed outside the allowlist): $ob"
                fail=1; continue
              fi
              if ! git cat-file -e "HEAD:$DIR/$nb" 2>/dev/null; then
                echo "::error::$ob was removed but its normalized target $nb is missing."
                fail=1; continue
              fi
              oldhash="$(git rev-parse "$BASE_SHA:$DIR/$ob")"
              newhash="$(git rev-parse "HEAD:$DIR/$nb")"
              if [ "$oldhash" != "$newhash" ]; then
                echo "::error::$ob -> $nb changed SQL content during the rename (blob $oldhash != $newhash). Historical SQL must never change."
                fail=1; continue
              fi
              echo "OK: allowlisted content-identical normalization $ob -> $nb"
              # Record ONLY targets whose source was genuinely removed in this diff.
              echo "$nb" >> "$RENAME_TARGETS_FILE"
            done <<< "$del"
          else
            echo "OK: no migration was removed or renamed."
          fi

          # Helpers ------------------------------------------------------------
          # version prefix = filename up to the first underscore
          ver() { basename "$1" | sed 's/_.*//'; }
          # scheme: 'ts' for a 14-digit timestamp prefix, else 'seq'
          scheme() { case "$1" in [0-9][0-9][0-9][0-9][0-9][0-9][0-9][0-9][0-9][0-9][0-9][0-9][0-9][0-9]*) echo ts;; *) echo seq;; esac; }

          # File lists on base and HEAD (basenames only) -----------------------
          base_files="$(git ls-tree -r --name-only "$BASE_SHA" -- "$DIR" | grep '\.sql$' | xargs -n1 basename 2>/dev/null | sort || true)"
          head_files="$(git ls-tree -r --name-only HEAD -- "$DIR" | grep '\.sql$' | xargs -n1 basename | sort)"
          added_files="$(comm -13 <(printf '%s\n' "$base_files") <(printf '%s\n' "$head_files"))"
          # Normalized rename TARGETS are not new migrations — exclude them from the
          # monotonic check (0230 is legitimately < 070; it is a renamed historical file).
          # SECURITY: only exclude targets whose SOURCE was actually deleted in this diff.
          # Excluding the whole allowlist would let someone ADD a file named like a target
          # (e.g. 0661_…) without removing its source, skipping both the blob-hash check
          # (no deletion) and the ordering check (excluded) — a real bypass.
          rename_targets="$(sort -u "$RENAME_TARGETS_FILE" 2>/dev/null || true)"
          # Prefix-freeness must ALSO cover sanctioned rename targets: a PR that applies
          # only a SUBSET of the normalization (e.g. 066a->0661 while leaving 066) would
          # otherwise recreate the exact prefix ambiguity this change exists to remove.
          prefix_files="$(printf '%s\n' "$added_files" | sort -u)"
          # Monotonic ordering, by contrast, must NOT see rename targets (0230 < 070 is
          # legitimate for a renamed historical file).
          added_files="$(comm -23 <(printf '%s\n' "$added_files" | sort) <(printf '%s\n' "$rename_targets"))"

          # --- 2a. Uniqueness of version prefixes across all HEAD migrations ---
          echo "== Uniqueness check =="
          dups="$(printf '%s\n' "$head_files" | while read -r f; do [ -n "$f" ] && ver "$f"; done | sort | uniq -d || true)"
          if [ -n "$dups" ]; then
            echo "::error::Duplicate migration version prefix(es): $dups"
            fail=1
          else
            echo "OK: all version prefixes unique."
          fi

          # --- 2a-bis. PREFIX-FREENESS for NEWLY ADDED migrations -----------------
          # The invariant Scheme B exists to create: no version may be a prefix of
          # another, or replay order becomes tool-dependent (a filename sort and a
          # parsed-version sort disagree — exactly the 055 / 0551 divergence).
          # Scoped to ADDED versions so pre-existing (pre-normalization) pairs do not
          # false-fail unrelated PRs; the normalization PR itself removes them.
          echo "== Prefix-freeness check (added migrations + normalization targets) =="
          if [ -z "${prefix_files:-}" ]; then
            echo "No newly-added migrations to check."
          else
            all_vers="$(printf '%s\n' "$head_files" | while read -r hf; do
                          if [ -n "${hf:-}" ]; then ver "$hf"; fi
                        done | sort -u)"
            for f in $prefix_files; do
              nv="$(ver "$f")"
              bad=""
              for ov in $all_vers; do
                if [ "$ov" != "$nv" ]; then
                  case "$nv" in "$ov"*) bad="$bad$ov is a prefix of $nv;";; esac
                  case "$ov" in "$nv"*) bad="$bad$nv is a prefix of $ov;";; esac
                fi
              done
              if [ -n "$bad" ]; then
                echo "::error::$f introduces a version-prefix relationship — replay order would become tool-dependent: $bad"
                echo "::error::Pick a version that neither extends nor is extended by an existing version."
                fail=1
              else
                echo "OK: $nv is prefix-free."
              fi
            done
          fi

          # --- 2b. Monotonic ordering for added migrations (scheme-aware) ------
          echo "== Monotonic ordering check =="
          if [ -z "$added_files" ]; then
            echo "No newly-added migrations."
          else
            for f in $added_files; do
              v="$(ver "$f")"; s="$(scheme "$v")"
              # max existing (base) version within the same scheme
              # NOTE: this used to be `[ test ] && echo` — under `set -euo pipefail` a
              # false test on the LAST iteration made the subshell exit non-zero and
              # aborted the whole step, false-failing every newly added NNN_ migration.
              basemax="$(printf '%s\n' "$base_files" | while read -r b; do
                          [ -n "$b" ] || continue
                          bv="$(ver "$b")"
                          if [ "$(scheme "$bv")" = "$s" ]; then echo "$bv"; fi
                        done | sort | tail -1)"
              if [ -n "$basemax" ] && ! [ "$v" \> "$basemax" ]; then
                echo "::error::$f ($s scheme) is not greater than the latest existing $s migration ($basemax). Migrations must be append-only and monotonic."
                fail=1
              else
                echo "OK: $f > ${basemax:-<none>} ($s)"
              fi
            done
          fi

          exit $fail
