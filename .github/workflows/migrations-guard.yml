# Migrations guard — protects the append-only migration ledger.
#
# Runs on EVERY pull request. It used to be gated by `paths:`, which meant a PR
# that touched no migration produced NO check at all rather than a passing one —
# so the job could never be made a required status check without deadlocking
# every unrelated PR. Change detection now happens INSIDE the job: if nothing
# under supabase/migrations/** changed, the job exits 0 early. The check is
# therefore always present and always conclusive.
#
# Invariants enforced against the PR base:
#   0. The base must be resolvable and must be an ancestor of HEAD. Every other
#      check is relative to it, so an unresolvable base must never pass vacuously.
#      On the normal path the base is HEAD^1 -- the merge checkout's base parent --
#      because github.event.pull_request.base.sha is pinned at PR creation and goes
#      stale as main advances. When HEAD is NOT a two-parent merge the job falls
#      back to the event base (pull_request.base.sha, or merge_group.base_sha),
#      which carries that staleness risk; the fallback exists so the job stays
#      conclusive rather than silently skipping.
#   1. Immutability — an existing migration may not be modified, deleted,
#      renamed, or have its object TYPE changed (e.g. a .sql file replaced by a
#      symlink pointing at SQL outside this directory). Applied migrations are
#      history; changing one silently diverges every environment that ran it.
#   2. Well-formed names — a NEW migration must be exactly `NNN_name.sql` (three
#      digits) or `YYYYMMDDHHMMSS_name.sql` (fourteen digits). This forbids
#      re-introducing the letter-suffixed versions (`071a_`) that the Supabase
#      CLI cannot parse, non-padded versions (`71_`) that would poison the
#      ordering comparison, and any name whose characters would misbehave in
#      shell word-splitting or git path quoting.
#   3. Unique and prefix-free versions — no version may equal or be a prefix of
#      another (`070` vs `0700`). A prefix relationship makes replay order depend
#      on tool internals: CLI 2.75.0 (Go) sorted by raw filename, 2.115.0 (TS)
#      re-sorts by parsed version, and those two orders disagree.
#   4. Monotonic ordering — a new migration must sort after the latest existing
#      migration of the same scheme.
#   5. Assembler integrity (G-4) — a migration GENERATED from reviewed slices
#      must be exactly its committed assembler's output over EXACTLY the set of
#      slices committed to git, byte for byte. The slices are canonical; the
#      migration is a build artifact.
#      Spec and evidence: docs/phase2/_impl/G4_assembler_integrity.md.
#
#      THE GATE NEVER TAKES THE ASSEMBLER'S WORD FOR WHAT TO CHECK. Its first
#      revision read the assembler's own `--manifest` as the source of truth for
#      which slices existed and where they lived; an adversarial pass then made
#      it exit 0 four different ways while the slices and the artifact genuinely
#      disagreed (a manifest that omits a slice, a smuggled non-slice input, a
#      symlinked slice, a decoy slice directory). Every fact is now derived from
#      `git ls-files` and from the assembler's FILENAME, and the manifest is only
#      cross-checked against those. Do not reintroduce trust in it.
#
# WHY 5 LIVES IN THIS JOB, AND WHY IT RUNS FIRST.
#   * Same job, not a new one. `Migrations guard / Immutability + ordering` is
#     already the required status check for this directory. A second required
#     context reports nothing until it has run once — the "disappearing required
#     check" deadlock this repo has already paid for twice (see the pgTAP step
#     comment in ci.yml). Two steps in one job cost one check and block merge
#     just as hard.
#   * Before the change detection in step 0b, and before the AUTODEPLOY
#     acknowledgement in 0c. The drift this catches is most often a PR that
#     edits ONLY the slices and never regenerates the migration. Such a PR
#     touches nothing under supabase/migrations/, so anything placed after the
#     early-exit would never see it — the guard would be silent in exactly the
#     case it exists for.
#   * Unconditional. It never early-exits: a repo with no assembler and no
#     generated migration fails the floor rather than passing vacuously.
#
# HISTORY: a one-time allowlist here permitted the 16 Scheme-B normalization
# renames (055b -> 0551, …) as content-identical renames. The production ledger
# repair completed on 2026-08-26 and that exception has been REMOVED. Historical
# renames are forbidden again with no standing exception. Do not re-add an
# allowlist; a future normalization needs its own reviewed, time-boxed change.
name: Migrations guard

on:
  pull_request:
    types: [opened, synchronize, reopened, edited]
  merge_group:

permissions:
  contents: read

jobs:
  guard:
    name: Immutability + ordering
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout (full history)
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          fetch-depth: 0

      # --- Invariant 5: assembled migrations reproduce from their slices ------
      # Deliberately the FIRST check in the job and deliberately unconditional:
      # a slices-only PR changes nothing under supabase/migrations/ and would be
      # waved through by the change detection in the next step.
      #
      # The gate is generic. It discovers scripts/assemble_*.sh, reads each
      # assembler's `--manifest`, rebuilds the artifact in a scratch directory
      # from the committed slices, and compares byte-for-byte. Adding 094 needs
      # no edit here.
      - name: Assembled migrations match their slices (G-4)
        run: |
          set -euo pipefail
          test -x scripts/ci/assembled_migration_integrity.sh || {
            echo "::error::scripts/ci/assembled_migration_integrity.sh is missing or not executable — the slice/artifact drift gate would silently pass."
            exit 1
          }
          # --require-committed: every build input must equal its HEAD blob, so
          # CI can never validate a worktree that differs from what was reviewed.
          # (It is implied by $CI too; passed explicitly so the intent is legible
          # here and does not depend on a runner environment variable.)
          scripts/ci/assembled_migration_integrity.sh --require-committed

      # Proves the gate above actually fires. It rebuilds the assembler inputs in
      # $RUNNER_TEMP, breaks them one way at a time (missing slice, duplicated
      # slice, reordered slices, stale artifact, hand-edited artifact, whitespace
      # drift, plus anti-vacuity, determinism, and the ASSEMBLER-LEVEL bypasses)
      # and asserts a non-zero exit with the right message each time — and a
      # clean PASS on the untouched baseline, so a gate that failed
      # unconditionally could not score well.
      #
      # The B-series matters most: those scenarios subvert the ASSEMBLER and
      # leave the artifact perfectly consistent with the subverted build, so the
      # byte comparison alone cannot see them. All of them passed the gate's
      # first revision. Sandboxes are real git repositories, because the gate
      # takes its facts from the git index.
      #
      # It runs on every PR rather than only when the gate's own sources change:
      # the thing most likely to quietly defeat it is a change to an ASSEMBLER or
      # a slice layout, not a change to the gate.
      - name: G-4 gate self-test (the guard must be seen to fail)
        run: |
          set -euo pipefail
          test -x scripts/ci/assembled_migration_integrity_selftest.sh || {
            echo "::error::scripts/ci/assembled_migration_integrity_selftest.sh is missing or not executable — the drift gate would be unproven."
            exit 1
          }
          scripts/ci/assembled_migration_integrity_selftest.sh

      - name: Check migrations
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          # merge_group events carry no pull_request object; without this the base
          # would be empty and the job would fail closed on every queued PR.
          MG_BASE: ${{ github.event.merge_group.base_sha }}
          # Used only to detect a parent-swapped merge checkout (see below).
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          # AUTODEPLOY-1 acknowledgement (step 0c). Passed through the env rather
          # than interpolated into the script body: a PR description is
          # attacker-controlled text and `${{ }}` inside run: is a shell-injection
          # sink. As an env var it is inert data.
          PR_BODY: ${{ github.event.pull_request.body }}
        run: |
          set -euo pipefail
          export LC_ALL=C
          DIR="supabase/migrations"
          fail=0

          # --- 0. Resolve the base commit ------------------------------------
          # `github.event.pull_request.base.sha` is pinned when the PR is created
          # and goes STALE as the base branch advances. actions/checkout checks out
          # refs/pull/N/merge, whose FIRST PARENT is the CURRENT base tip — that is
          # the correct base. Diffing against the pinned value instead reports every
          # migration merged upstream since as though THIS PR deleted it (verified
          # against live PRs whose base.sha predates the normalization: 48 phantom
          # paths, 17 errors, on a PR containing no SQL at all).
          # merge-base does NOT fix this: base.sha is an ancestor of the merge
          # commit, so merge-base(base.sha, HEAD) == base.sha.
          # merge_group payloads carry no pull_request object, so BASE_SHA is empty
          # there; without MG_BASE the job would fail closed on every queued PR.
          EVENT_BASE="${BASE_SHA:-}"
          [ -n "$EVENT_BASE" ] || EVENT_BASE="${MG_BASE:-}"

          if [ "$(git rev-list --parents -n 1 HEAD | wc -w)" -eq 3 ]; then
            BASE="$(git rev-parse HEAD^1)"
            echo "HEAD is a two-parent merge; using its FIRST parent as base: $BASE"
          else
            # Octopus merges (3+ parents) land here too: no single base parent.
            BASE="$EVENT_BASE"
            echo "HEAD is not a two-parent merge; falling back to the event base: ${BASE:-<empty>}"
          fi
          if [ -z "$BASE" ]; then
            echo "::error::Could not determine a base commit — refusing to pass without verifying anything."
            exit 1
          fi
          if ! git cat-file -e "${BASE}^{commit}" 2>/dev/null; then
            echo "::error::Base '${BASE}' is not a commit in this checkout (is fetch-depth: 0 set?)."
            exit 1
          fi
          if ! git merge-base --is-ancestor "$BASE" HEAD; then
            echo "::error::Base '${BASE}' is not an ancestor of HEAD — the diff would be meaningless."
            exit 1
          fi
          # Guard against a PARENT-SWAPPED merge: if HEAD is merge(feature, base)
          # instead of merge(base, feature), HEAD^1 is the PR's own tip and the diff
          # compares the branch against itself — a deleted migration then reports
          # "nothing to guard".
          #
          # Note the obvious test does NOT work: asserting the event base is an
          # ancestor of the derived base passes in BOTH cases, because a feature
          # branch is itself branched from the base. Verified by reproduction.
          # The discriminator is the PR HEAD: on a correct merge ref the base parent
          # cannot contain it, whereas a swapped first parent IS it.
          if [ -n "${HEAD_SHA:-}" ] && git cat-file -e "${HEAD_SHA}^{commit}" 2>/dev/null; then
            if git merge-base --is-ancestor "$HEAD_SHA" "$BASE"; then
              echo "::error::Derived base '$BASE' contains the PR head '$HEAD_SHA' — the merge parents appear swapped. Refusing to diff this branch against itself."
              exit 1
            fi
          fi
          echo "Base commit resolved: $BASE"

          # --- 0b. Change detection (replaces the workflow-level `paths:` filter) ---
          changed="$(git diff --no-renames --name-only "$BASE" HEAD -- "$DIR")"
          if [ -z "$changed" ]; then
            echo "No changes under $DIR — nothing to guard."
            echo "This job still reports success so it can be a required check on every PR."
            exit 0
          fi
          echo "== Migration files touched by this PR =="
          printf '%s\n' "$changed" | sed 's/^/  - /'

          # --- 0c. AUTODEPLOY-1 deploy-path precondition ----------------------
          # On this repository, merging to main IS the production apply: the
          # Supabase GitHub integration runs `db push` against the production
          # database on every push to main, outside CI and with no approval
          # gate. That is how migration 071 reached production on 2026-08-27
          # while every repo document asserted merges do not deploy.
          #
          # CI cannot read the Supabase dashboard setting — no Management API or
          # CLI surface exposes it. So this gate does the only honest thing it
          # can: it refuses to let a migration-bearing PR go green until a human
          # has recorded that they checked. It proves an acknowledgement was
          # made, NOT that auto-deploy is actually off. Do not read a green
          # check as evidence about the dashboard.
          #
          # To pass: put a line in the PR DESCRIPTION (not a comment) reading
          #   AUTODEPLOY-VERIFIED-OFF: YYYY-MM-DD
          # The workflow triggers on `edited`, so the check re-runs when the
          # description is updated. See docs/operations/DEPLOYMENT_PATHS.md.
          if [ "${GITHUB_EVENT_NAME:-}" = "pull_request" ]; then
            if printf '%s' "${PR_BODY:-}" | grep -qE '^[[:space:]]*AUTODEPLOY-VERIFIED-OFF:[[:space:]]*[0-9]{4}-[0-9]{2}-[0-9]{2}[[:space:]]*$'; then
              echo "AUTODEPLOY-1 precondition acknowledged in the PR description:"
              printf '%s' "${PR_BODY:-}" | grep -E '^[[:space:]]*AUTODEPLOY-VERIFIED-OFF:' | sed 's/^/  /'
              echo "NOTE: this records a human acknowledgement. It is not proof the setting is off."
            else
              echo "::error::This PR changes supabase/migrations/** and merging to main applies migrations to PRODUCTION (AUTODEPLOY-1). Confirm in the Supabase dashboard that production auto-deploy is OFF, then add a line to the PR description: 'AUTODEPLOY-VERIFIED-OFF: YYYY-MM-DD'. See docs/operations/DEPLOYMENT_PATHS.md."
              exit 1
            fi
          fi

          # --- 1. Immutability ------------------------------------------------
          # Rename detection is disabled so a rename is reported as delete + add and
          # is caught by the deletion check below. Filters M and T together cover
          # every way an existing path can be altered: content, file mode, and object
          # type. T matters: replacing a .sql file with a SYMLINK is invisible to a
          # plain M filter, and would let arbitrary SQL be sourced from outside this
          # directory while the guard reported "no existing migration was modified".
          echo "== Immutability check (base $BASE -> HEAD) =="

          mod="$(git diff --no-renames --diff-filter=MT --name-only "$BASE" HEAD -- "$DIR")"
          if [ -n "$mod" ]; then
            echo "::error::Existing migration files were modified (content, mode, or object type). Migrations are append-only:"
            printf '%s\n' "$mod" | sed 's/^/  - /'
            fail=1
          else
            echo "OK: no existing migration was modified."
          fi

          del="$(git diff --no-renames --diff-filter=D --name-only "$BASE" HEAD -- "$DIR")"
          if [ -n "$del" ]; then
            echo "::error::Existing migration files were deleted or renamed. Migrations are append-only."
            printf '%s\n' "$del" | sed 's/^/  - /'
            fail=1
          else
            echo "OK: no migration was removed or renamed."
          fi

          # --- 2. Name format for NEWLY ADDED files ---------------------------
          # Applied to every added path under $DIR, not just *.sql, so a stray file
          # cannot sit in the migrations directory and become permanently
          # unmodifiable. Also the cheapest defence against filenames that break
          # shell word-splitting or get C-quoted by git.
          echo "== Name format check (added files) =="
          added_paths="$(git diff --no-renames --diff-filter=A --name-only "$BASE" HEAD -- "$DIR")"
          if [ -z "$added_paths" ]; then
            echo "No newly-added files."
          else
            while IFS= read -r p; do
              [ -n "$p" ] || continue
              b="${p##*/}"
              # A migration must be a REGULAR FILE. An added SYMLINK passes every
              # other check (name, prefix, ordering) and reviews as a one-line "add
              # migration" diff — but its SQL lives outside this directory, so a
              # later PR editing only that target changes an APPLIED migration while
              # change detection reports "nothing to guard". Mode 120000 is a
              # symlink, 160000 a gitlink/submodule.
              amode="$(git ls-tree HEAD -- "$p" | awk '{print $1}')"
              case "$amode" in
                100644|100755) ;;
                *)
                  echo "::error::$p is not a regular file (mode ${amode:-unknown}). Migrations must be real files — a symlink or gitlink would let an applied migration's SQL be changed from outside supabase/migrations."
                  fail=1
                  ;;
              esac
              if printf '%s' "$b" | grep -Eq '^([0-9]{3}|[0-9]{14})_[A-Za-z0-9_]+\.sql$'; then
                echo "OK: $b is a well-formed migration name."
              else
                echo "::error::$p is not a valid migration filename."
                echo "::error::Expected NNN_name.sql (exactly 3 digits) or YYYYMMDDHHMMSS_name.sql (exactly 14), name in [A-Za-z0-9_]."
                echo "::error::Letter-suffixed (071a_) and non-padded (71_) versions are rejected: the Supabase CLI cannot parse the first, and the second breaks ordering comparisons permanently."
                fail=1
              fi
            done <<< "$added_paths"
          fi

          # Helpers ------------------------------------------------------------
          # MUST emit a trailing newline: callers pipe this into `sort | uniq -d`
          # and into `sort -u`. Without the newline every version concatenates onto
          # ONE line, `uniq -d` finds nothing, and the uniqueness and prefix checks
          # silently pass on any input.
          ver() { local b="${1##*/}"; printf '%s\n' "${b%%_*}"; }
          # scheme: 'ts' for a 14-digit timestamp prefix, else 'seq'
          scheme() { case "$1" in [0-9][0-9][0-9][0-9][0-9][0-9][0-9][0-9][0-9][0-9][0-9][0-9][0-9][0-9]*) echo ts;; *) echo seq;; esac; }

          # File lists (basenames). -z keeps git from C-quoting non-ASCII paths,
          # which would otherwise drop them from `grep '\.sql$'` and make them
          # invisible to every check below.
          list_sql() { git ls-tree -r -z --name-only "$1" -- "$DIR" | tr '\0' '\n' | grep '\.sql$' | sed 's#.*/##' | sort; }
          base_files="$(list_sql "$BASE" || true)"
          head_files="$(list_sql HEAD)"
          added_files="$(comm -13 <(printf '%s\n' "$base_files") <(printf '%s\n' "$head_files"))"

          # --- 3a. Uniqueness of version prefixes across all HEAD migrations ---
          echo "== Uniqueness check =="
          # `if … then … fi`, not `[ … ] && …`: the latter makes the subshell exit
          # non-zero when the final iteration's test is false, which under
          # `set -euo pipefail` aborts the step.
          dups="$(printf '%s\n' "$head_files" | while read -r f; do
                    if [ -n "$f" ]; then ver "$f"; fi
                  done | sort | uniq -d || true)"
          if [ -n "$dups" ]; then
            echo "::error::Duplicate migration version prefix(es): $dups"
            fail=1
          else
            echo "OK: all version prefixes unique."
          fi

          # --- 3b. PREFIX-FREENESS for NEWLY ADDED migrations -----------------
          echo "== Prefix-freeness check (added migrations) =="
          if [ -z "${added_files:-}" ]; then
            echo "No newly-added migrations to check."
          else
            all_vers="$(printf '%s\n' "$head_files" | while read -r hf; do
                          if [ -n "${hf:-}" ]; then ver "$hf"; fi
                        done | sort -u)"
            # Safe to word-split: the name-format gate above rejects anything
            # outside [0-9A-Za-z_.], so no element can contain a space or a glob.
            for f in $added_files; do
              nv="$(ver "$f")"
              bad=""
              for ov in $all_vers; do
                if [ "$ov" != "$nv" ]; then
                  case "$nv" in "$ov"*) bad="$bad$ov is a prefix of $nv;";; esac
                  case "$ov" in "$nv"*) bad="$bad$nv is a prefix of $ov;";; esac
                fi
              done
              if [ -n "$bad" ]; then
                echo "::error::$f introduces a version-prefix relationship — replay order would become tool-dependent: $bad"
                echo "::error::Pick a version that neither extends nor is extended by an existing version."
                fail=1
              else
                echo "OK: $nv is prefix-free."
              fi
            done
          fi

          # --- 4. Monotonic ordering for added migrations (scheme-aware) ------
          echo "== Monotonic ordering check =="
          if [ -z "$added_files" ]; then
            echo "No newly-added migrations."
          else
            for f in $added_files; do
              v="$(ver "$f")"; s="$(scheme "$v")"
              basemax="$(printf '%s\n' "$base_files" | while read -r b; do
                          [ -n "$b" ] || continue
                          bv="$(ver "$b")"
                          if [ "$(scheme "$bv")" = "$s" ]; then echo "$bv"; fi
                        done | sort | tail -1)"
              if [ -n "$basemax" ] && ! [ "$v" \> "$basemax" ]; then
                echo "::error::$f ($s scheme) is not greater than the latest existing $s migration ($basemax). Migrations must be append-only and monotonic."
                fail=1
              else
                echo "OK: $f > ${basemax:-<none>} ($s)"
              fi
            done
          fi

          exit $fail
