# CI — quality gate for the Snatch It monorepo (mobile app + Supabase + web).
#
# Runs on every PR into main, and on pushes to any non-main branch so feature
# branches get fast feedback. Nothing in THIS WORKFLOW deploys or touches
# production — see .github/workflows/README.md for what is intentionally
# deferred.
#
# That is a statement about GitHub Actions, NOT about the repository. A second
# deployment path exists outside CI: the Supabase GitHub integration applies
# pending supabase/migrations/** to the PRODUCTION database on every merge to
# main (check name "Supabase Preview", app "Supabase" — the label is
# misleading, it targets production). It put migration 071 into production on
# 2026-08-27 with no approval gate. Until an owner confirms that control is
# off, no migration-bearing PR may merge to main.
# Canonical: docs/operations/DEPLOYMENT_PATHS.md
#
# Least-privilege: read-only token for the whole workflow. No job needs write.
name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches-ignore: [main]

permissions:
  contents: read

# One run per ref; new pushes cancel the in-flight run.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ---------------------------------------------------------------------------
  # quality: TypeScript typecheck + ESLint + vitest unit tests for the mobile
  # app (repo root). Scripts come straight from package.json:
  #   typecheck -> "tsc --noEmit -p ."
  #   lint      -> "expo lint"
  #   test      -> "vitest run"  (money / payout suites in tests/)
  # ---------------------------------------------------------------------------
  quality:
    name: Typecheck / Lint / Unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install (clean, from lockfile)
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Unit tests
        run: npm run test

  # ---------------------------------------------------------------------------
  # db: prove the migration chain applies cleanly on a FRESH database.
  #
  # These migrations are Supabase-flavoured SQL: they reference the auth /
  # storage schemas, auth.users, and the anon / authenticated / service_role
  # roles. A plain `postgres:17` container does NOT provide those, so we bring
  # up the real Supabase local stack via the CLI, which applies every file in
  # supabase/migrations/ in version order on a brand-new DB. If any migration
  # errors, `supabase start` exits non-zero and this job fails.
  # ---------------------------------------------------------------------------
  db:
    name: Migrations apply cleanly (fresh DB)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0

      - name: Install Supabase CLI
        uses: supabase/setup-cli@46f7f98c7f948ad727d22c1e67fab04c223a0520 # v3.0.0
        with:
          # PINNED — never `latest`. The migration chain's replay order is a
          # correctness property of this repo; it must not float with tooling.
          # 2.115.0 is the version whose ordering behaviour was verified against
          # the normalized (Scheme B) chain. Upgrades require a deliberate PR:
          # bump pin -> fresh replay green -> Gate-2 parity green -> merge.
          version: 2.115.0

      # supabase/config.toml is not committed; create it if absent. Non-interactive
      # in CI (no TTY). Ensure [db].major_version = 17 to match production.
      - name: Ensure Supabase project config
        run: |
          if [ ! -f supabase/config.toml ]; then
            supabase init
          fi

      # Boot the local stack. Migrations in supabase/migrations/ are applied on
      # first start; a failure in any migration fails this step. We exclude
      # cosmetic / non-schema services to keep the run fast — everything that
      # creates schema (db, auth, storage, rest, realtime, pooler) stays up.
      - name: Apply migration chain on fresh DB
        run: |
          supabase start \
            -x studio,inbucket,imgproxy,edge-runtime,logflare,vector

      - name: Show applied migrations
        if: always()
        run: supabase migration list || true

      # Discovery proof: the CLI must apply EVERY file in supabase/migrations.
      # A skipped file (unparseable name) is a silent wrong-schema hazard — it is
      # exactly how the letter-suffixed chain used to "pass" while being wrong.
      - name: Migration discovery proof (zero skipped, zero duplicates)
        run: |
          set -euo pipefail
          files=$(ls supabase/migrations/*.sql | wc -l | tr -d ' ')
          applied=$(psql "$DB_URL" -tAc "select count(*) from supabase_migrations.schema_migrations;")
          dupes=$(ls supabase/migrations/*.sql | xargs -n1 basename | sed 's/_.*//' | sort | uniq -d | wc -l | tr -d ' ')
          echo "migration files on disk : $files"
          echo "applied by the CLI      : $applied"
          echo "duplicate versions      : $dupes"
          if [ "$files" != "$applied" ]; then
            echo "::error::CLI applied $applied of $files migrations — some were SKIPPED (unparseable filename)."; exit 1
          fi
          if [ "$dupes" != "0" ]; then echo "::error::duplicate version prefixes"; exit 1; fi
          echo "OK: every migration discovered and applied; no duplicates."
        env:
          DB_URL: postgresql://postgres:postgres@127.0.0.1:54322/postgres

      # Gate-2 parity: the freshly replayed schema must match the certified
      # Phase-0 baseline. Counts are printed for the PR record; drift fails.
      - name: Gate-2 parity (fresh replay vs certified baseline)
        run: |
          set -euo pipefail
          q() { psql "$DB_URL" -tAc "$1" | tr -d ' '; }
          tables=$(q "select count(*) from pg_tables where schemaname='public';")
          funcs=$(q "select count(*) from pg_proc p join pg_namespace n on n.oid=p.pronamespace where n.nspname='public';")
          policies=$(q "select count(*) from pg_policies where schemaname='public';")
          triggers=$(q "select count(*) from pg_trigger t join pg_class c on c.oid=t.tgrelid join pg_namespace n on n.oid=c.relnamespace where n.nspname='public' and not t.tgisinternal;")
          echo "tables=$tables functions=$funcs policies=$policies triggers=$triggers"
          echo "GATE2_COUNTS tables=$tables functions=$funcs policies=$policies triggers=$triggers" >> "$GITHUB_STEP_SUMMARY"
          fail=0
          [ "$tables"   -eq "$EXPECT_TABLES" ]   || { echo "::error::tables $tables != $EXPECT_TABLES (Gate-2 drift)"; fail=1; }
          [ "$funcs"    -eq "$EXPECT_FUNCS" ]    || { echo "::error::functions $funcs != $EXPECT_FUNCS (Gate-2 drift)"; fail=1; }
          [ "$policies" -eq "$EXPECT_POLICIES" ] || { echo "::error::policies $policies != $EXPECT_POLICIES (Gate-2 drift)"; fail=1; }
          [ "$triggers" -eq "$EXPECT_TRIGGERS" ] || { echo "::error::triggers $triggers != $EXPECT_TRIGGERS (Gate-2 drift)"; fail=1; }
          exit $fail
        env:
          DB_URL: postgresql://postgres:postgres@127.0.0.1:54322/postgres
          # Certified Phase-0 Gate-2 baseline (PHASE_0_GATE2_SCHEMA_DIFF.md).
          # 2026-08-27, migration 072 (H-1): functions 68 -> 69 and triggers
          # 23 -> 24. 072 is purely additive — it creates exactly one function
          # (guard_listing_insert_columns) and one trigger
          # (trg_guard_listing_insert on public.listings) and alters nothing that
          # already existed. Until 072 is applied to production, the fresh replay
          # is intentionally ONE function and ONE trigger ahead of the production
          # catalog; that gap closes on apply. Tables and policies are unchanged.
          EXPECT_TABLES: 27
          EXPECT_FUNCS: 69
          EXPECT_POLICIES: 37
          EXPECT_TRIGGERS: 24

      # Privilege-parity diagnostic. Production's table grants come from Supabase's
      # DEFAULT PRIVILEGES, not from the migration chain (migration 063 says so
      # explicitly), so the chain cannot reproduce them from source. If the fresh
      # stack does not have them, the security suite tests a DIFFERENT privilege
      # surface than production -- and "anon cannot read X" would pass because the
      # grant is missing, not because RLS works. That is a vacuous pass, so this
      # step measures the gap before the suite runs.
      # Apply the production privilege surface to the fresh database, then PROVE
      # it matches. See supabase/ci/parity_grants.sql for the full rationale
      # (finding REPLAY-1): production's table grants come from Supabase's
      # environment bootstrap, not from the migration chain, so a fresh replay
      # has almost no grants. Without this, most of the security suite would pass
      # because the GRANT is missing rather than because RLS works.
      - name: Privilege parity with production (CI-only bootstrap)
        run: |
          set -euo pipefail
          echo "--- BEFORE (fresh replay, grants from the migration chain alone) ---"
          psql "$DB_URL" -tA -c "
            select grantee||' '||count(distinct table_name)||' tables'
            from information_schema.role_table_grants
            where table_schema='public' and grantee in ('anon','authenticated','service_role')
              and privilege_type='SELECT' group by grantee order by grantee;"
          psql "$DB_URL" -v ON_ERROR_STOP=1 -q -f supabase/ci/parity_grants.sql
          echo "--- AFTER: full matrix must equal supabase/ci/expected_grants.txt ---"
          psql "$DB_URL" -tA -F'|' -c "
            select grantee, table_name, string_agg(privilege_type, ',' order by privilege_type)
            from information_schema.role_table_grants
            where table_schema='public' and grantee in ('anon','authenticated','service_role')
            group by grantee, table_name order by grantee, table_name;" \
            | sed 's/[[:space:]]*$//' | sort > "$RUNNER_TEMP/actual_grants.txt"
          if ! diff -u supabase/ci/expected_grants.txt "$RUNNER_TEMP/actual_grants.txt"; then
            echo "::error::privilege surface does not match production. A count-only check would have missed this — an earlier revision over-granted public.transfers (production is SELECT-only there per migration 055) and silently broke three assertions."
            exit 1
          fi
          echo "OK: $(wc -l < supabase/ci/expected_grants.txt | tr -d ' ') grant rows match the expected fixture (production minus the DRIFT-1 departure)."
          # profiles must remain COLUMN-granted, never table-granted.
          tbl=$(psql "$DB_URL" -tAc "select count(*) from information_schema.role_table_grants where table_schema='public' and table_name='profiles' and grantee in ('anon','authenticated');")
          col=$(psql "$DB_URL" -tAc "select count(*) from information_schema.column_privileges where table_schema='public' and table_name='profiles' and grantee='authenticated' and privilege_type='SELECT';")
          echo "  profiles: client table-level grants=$tbl (must be 0), column-level SELECT=$col (must be > 0)"
          [ "$tbl" = "0" ] || { echo "::error::profiles gained a table-level client grant — column restrictions bypassed"; exit 1; }
          [ "$col" -gt 0 ] || { echo "::error::profiles lost its column-level grants"; exit 1; }
        env:
          DB_URL: postgresql://postgres:postgres@127.0.0.1:54322/postgres

      # pgTAP database security gate. Runs against the SAME freshly-replayed
      # stack booted above, so it costs no second boot and is guaranteed to be
      # testing the schema this PR actually produces.
      #
      # This step deliberately lives inside the existing `db` job rather than a
      # new one: `Migrations apply cleanly (fresh DB)` is already a REQUIRED
      # status check, so a pgTAP failure blocks merge immediately. Adding a
      # separate job would mean a second required context that reports nothing
      # until it has run once — the "disappearing required check" deadlock this
      # repo already fixed for the migrations guard. Do NOT rename this job.
      - name: pgTAP database security suite
        run: |
          set -euo pipefail
          if ! ls supabase/tests/*.sql >/dev/null 2>&1; then
            echo "::error::supabase/tests/*.sql missing — the security gate would silently pass."
            exit 1
          fi
          files=$(ls supabase/tests/*.sql | wc -l | tr -d ' ')
          planned=$(grep -ho 'plan([0-9]*)' supabase/tests/*.sql | grep -o '[0-9]*' | paste -sd+ - | bc)
          echo "test files: $files    planned assertions: $planned"
          supabase test db --local 2>&1 | tee "$RUNNER_TEMP/tap.txt"

      # Parse the TAP stream for the record. `set -o pipefail` above already
      # fails the job on a non-zero pg_prove exit; this makes the numbers
      # explicit in the PR so "green" can never mean "the files merely exist".
      - name: pgTAP result summary
        if: always()
        run: |
          set -uo pipefail
          f="$RUNNER_TEMP/tap.txt"
          [ -f "$f" ] || { echo "::error::no TAP output captured — the suite did not run."; exit 1; }
          # pg_prove prints a per-file summary and a "Files=N, Tests=N" footer,
          # NOT raw TAP ok/not ok lines. Parsing for '^ok' yields 0/0/0/0 and
          # would report a clean sheet for a suite that never ran -- exactly the
          # vacuous-green this gate exists to prevent. Parse what pg_prove emits.
          # Report ONLY what pg_prove actually emits. An earlier version of this
          # step printed passed/failed/skipped/todo counts it could not measure:
          # it grepped for raw TAP '^not ok' and '# TODO' lines, which pg_prove
          # never prints, so failed/skipped/todo were permanently 0 and "passed"
          # was assigned the number of tests RUN. It printed passed=214 failed=0
          # for a run that had 212 passing and 2 failing-but-TODO. Worse, wrapping
          # any future failing security assertion in todo() would have kept the
          # gate green AND counted it as passed. The real gate is result=PASS plus
          # assertions-run == assertions-planned; claim nothing beyond that.
          files_n=$(grep -oE 'Files=[0-9]+' "$f" | tail -1 | cut -d= -f2 || true)
          tests_n=$(grep -oE 'Tests=[0-9]+' "$f" | tail -1 | cut -d= -f2 || true)
          result=$(grep -oE '^Result: (PASS|FAIL|NOTESTS)' "$f" | tail -1 | awk '{print $2}' || true)
          failing_files=$(grep -cE '\(Wstat: ' "$f" || true)
          badplan=$(grep -cE 'Parse errors: Bad plan' "$f" || true)
          todo_fail=$(grep -cE '# Failed \(TODO\) test' "$f" || true)
          echo "files=$files_n tests_ran=$tests_n result=$result failing_files=$failing_files bad_plans=$badplan todo_failing=$todo_fail"
          {
            echo "### pgTAP database security gate"
            echo ""
            echo "| metric | value |"
            echo "|---|---|"
            echo "| test files | ${files_n:-?} |"
            echo "| assertions executed | ${tests_n:-?} |"
            echo "| files with failures | ${failing_files:-?} |"
            echo "| bad plans | ${badplan:-?} |"
            echo "| failing-but-TODO (not gating) | ${todo_fail:-?} |"
            echo "| pg_prove result | ${result:-none} |"
          } >> "$GITHUB_STEP_SUMMARY"
          if [ "${result:-}" != "PASS" ] || [ "${badplan:-0}" -gt 0 ]; then
            echo "::error::pgTAP did not pass cleanly (result=${result:-none}, bad plans=${badplan:-0}, failing files=${failing_files:-0})."
            grep -aE 'Parse errors|Failed [0-9]+/|not ok |ERROR:|Result:' "$f" | head -40
            exit 1
          fi
          planned_total=$(grep -ho 'plan([0-9]*)' supabase/tests/*.sql | grep -o '[0-9]*' | paste -sd+ - | bc)
          if [ "${tests_n:-0}" != "$planned_total" ]; then
            echo "::error::ran ${tests_n:-0} assertions but $planned_total were planned — some file aborted early."
            exit 1
          fi
          # Coverage floor. Without it, DELETING test files keeps the gate green:
          # both guards above compare the suite against ITSELF (tests run vs plans
          # of the files currently on disk), so they stay consistent as coverage
          # shrinks. These are ratchets — raise them when coverage grows, never
          # lower them to make a red build pass.
          # Ratchets raised 2026-08-27 with supabase/tests/045_listing_insert_authority.sql
          # (H-1): 12 -> 13 files, 214 -> 234 assertions.
          # Ratchets, reconciled across the pre-implementation security series.
          # Baseline before the series was 13 files / 234 assertions.
          #   073 SEC-3 -> 130_storage_bucket_constraints.sql (+1 file, +18) = 14 / 252
          #   074 SEC-1 -> 131_privilege_cleanup.sql          (+1 file, +24) = 15 / 276
          #   075 SEC-4 + D-5 -> 132_replay_parity.sql        (+1 file, +XX) = 16 / XXX
          MIN_FILES=16
          MIN_ASSERTIONS=999
          [ "${files_n:-0}" -ge "$MIN_FILES" ] || { echo "::error::pgTAP ran ${files_n:-0} files, floor is $MIN_FILES — test files were removed."; exit 1; }
          [ "$planned_total" -ge "$MIN_ASSERTIONS" ] || { echo "::error::suite plans $planned_total assertions, floor is $MIN_ASSERTIONS — coverage was reduced."; exit 1; }
          echo "coverage floor OK: $files_n files >= $MIN_FILES, $planned_total assertions >= $MIN_ASSERTIONS"

  # ---------------------------------------------------------------------------
  # web: build the Next.js app in web/. Runs only when web/package.json exists.
  # web/ pins Node >=22 (engines), so this job uses Node 22 even though the
  # mobile quality job uses Node 20. Vendored @snatchit/* tarballs live in
  # web/vendor/ and resolve from the committed lockfile.
  # ---------------------------------------------------------------------------
  web:
    name: Web build (Next.js)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # NOTE: a job-level `if: hashFiles(...)` is invalid (hashFiles is a
    # step-level function) and made GitHub reject this ENTIRE workflow at
    # startup (0s "workflow file issue", zero jobs, every event) — the reason
    # CI never ran during Phase 0. The job now always starts and its steps
    # skip when web/ is absent on the ref.
    defaults:
      run:
        working-directory: web
    steps:
      - name: Checkout
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0

      - name: Detect web app
        id: detect
        working-directory: .
        run: echo "exists=$([ -f web/package.json ] && echo yes || echo no)" >> "$GITHUB_OUTPUT"

      - name: Setup Node
        if: steps.detect.outputs.exists == 'yes'
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install (clean, from lockfile)
        if: steps.detect.outputs.exists == 'yes'
        run: npm ci

      - name: Build
        if: steps.detect.outputs.exists == 'yes'
        # The web app fails closed without these (by design — see web/src/lib/env).
        # CI compiles with well-formed public placeholders; the artifact is
        # discarded, never deployed (Vercel builds with real env separately).
        # NEXT_PUBLIC_* values are public-by-definition; no secrets here.
        env:
          NEXT_PUBLIC_SUPABASE_URL: https://ci-placeholder.supabase.co
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ci-placeholder-anon-key
          NEXT_PUBLIC_SITE_URL: https://ci-placeholder.snatchitapp.com
        run: npm run build
