# CI — quality gate for the Snatch It monorepo (mobile app + Supabase + web).
#
# Runs on every PR into main, and on pushes to any non-main branch so feature
# branches get fast feedback. Nothing here deploys or touches production —
# see .github/workflows/README.md for what is intentionally deferred.
#
# Least-privilege: read-only token for the whole workflow. No job needs write.
name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches-ignore: [main]

permissions:
  contents: read

# One run per ref; new pushes cancel the in-flight run.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ---------------------------------------------------------------------------
  # quality: TypeScript typecheck + ESLint + vitest unit tests for the mobile
  # app (repo root). Scripts come straight from package.json:
  #   typecheck -> "tsc --noEmit -p ."
  #   lint      -> "expo lint"
  #   test      -> "vitest run"  (money / payout suites in tests/)
  # ---------------------------------------------------------------------------
  quality:
    name: Typecheck / Lint / Unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install (clean, from lockfile)
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Unit tests
        run: npm run test

  # ---------------------------------------------------------------------------
  # db: prove the migration chain applies cleanly on a FRESH database.
  #
  # These migrations are Supabase-flavoured SQL: they reference the auth /
  # storage schemas, auth.users, and the anon / authenticated / service_role
  # roles. A plain `postgres:17` container does NOT provide those, so we bring
  # up the real Supabase local stack via the CLI, which applies every file in
  # supabase/migrations/ in version order on a brand-new DB. If any migration
  # errors, `supabase start` exits non-zero and this job fails.
  # ---------------------------------------------------------------------------
  db:
    name: Migrations apply cleanly (fresh DB)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0

      - name: Install Supabase CLI
        uses: supabase/setup-cli@46f7f98c7f948ad727d22c1e67fab04c223a0520 # v3.0.0
        with:
          # Pinned deliberately (was `latest`). Upgrades happen only via their
          # own PR that shows this job green on a fresh replay — never
          # implicitly.
          #
          # 2.115.0 is the TS-rewrite CLI, which sorts local migrations BY
          # VERSION before applying/reconciling. Do NOT "downgrade" this pin to
          # the Go CLI 2.75.0 (the version installed on the dev machine): the
          # Go CLI enumerates supabase/migrations/ in raw FILENAME order
          # (fs.ReadDir, no version re-sort), and the normalized 4-digit
          # versions (0231_, 0551_, ..., 0661_) sort BEFORE their 3-digit
          # parents as filenames ('1' 0x31 < '_' 0x5F) while sorting AFTER
          # them as versions. Under 2.75.0 a fresh replay silently applies
          # 0553 before 055 and 0601 before 060 — ending with the stale parent
          # function bodies (re-introducing the PGRST203 mark_transfer_sent
          # overload regression that 055d fixed, and the sweep-destination bug
          # that 060b fixed) — and post-repair `db push`/`migration up`
          # hard-fail with ErrMissingLocal. Verified against both CLIs'
          # sources; see PHASE_2_MIGRATION_REPAIR_EXECUTION_PLAN.md §2.
          version: 2.115.0

      # supabase/config.toml is not committed; create it if absent. Non-interactive
      # in CI (no TTY). Ensure [db].major_version = 17 to match production.
      - name: Ensure Supabase project config
        run: |
          if [ ! -f supabase/config.toml ]; then
            supabase init
          fi

      # Boot the local stack. Migrations in supabase/migrations/ are applied on
      # first start; a failure in any migration fails this step. We exclude
      # cosmetic / non-schema services to keep the run fast — everything that
      # creates schema (db, auth, storage, rest, realtime, pooler) stays up.
      - name: Apply migration chain on fresh DB
        run: |
          supabase start \
            -x studio,inbucket,imgproxy,edge-runtime,logflare,vector

      - name: Show applied migrations
        if: always()
        run: supabase migration list || true

      # TODO(owner): wire these once the test/RLS assets exist.
      #  - pgTAP RLS tests: add supabase/tests/*.sql then run:
      #      supabase test db
      #  - Static advisors / lint on the live schema:
      #      supabase db lint --level warning
      #      supabase inspect db  (or the security/performance advisors)
      # Kept as placeholders so this job becomes the single "schema health" gate.

  # ---------------------------------------------------------------------------
  # web: build the Next.js app in web/. Runs only when web/package.json exists.
  # web/ pins Node >=22 (engines), so this job uses Node 22 even though the
  # mobile quality job uses Node 20. Vendored @snatchit/* tarballs live in
  # web/vendor/ and resolve from the committed lockfile.
  # ---------------------------------------------------------------------------
  web:
    name: Web build (Next.js)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # NOTE: a job-level `if: hashFiles(...)` is invalid (hashFiles is a
    # step-level function) and made GitHub reject this ENTIRE workflow at
    # startup (0s "workflow file issue", zero jobs, every event) — the reason
    # CI never ran during Phase 0. The job now always starts and its steps
    # skip when web/ is absent on the ref.
    defaults:
      run:
        working-directory: web
    steps:
      - name: Checkout
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0

      - name: Detect web app
        id: detect
        working-directory: .
        run: echo "exists=$([ -f web/package.json ] && echo yes || echo no)" >> "$GITHUB_OUTPUT"

      - name: Setup Node
        if: steps.detect.outputs.exists == 'yes'
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install (clean, from lockfile)
        if: steps.detect.outputs.exists == 'yes'
        run: npm ci

      - name: Build
        if: steps.detect.outputs.exists == 'yes'
        # The web app fails closed without these (by design — see web/src/lib/env).
        # CI compiles with well-formed public placeholders; the artifact is
        # discarded, never deployed (Vercel builds with real env separately).
        # NEXT_PUBLIC_* values are public-by-definition; no secrets here.
        env:
          NEXT_PUBLIC_SUPABASE_URL: https://ci-placeholder.supabase.co
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ci-placeholder-anon-key
          NEXT_PUBLIC_SITE_URL: https://ci-placeholder.snatchitapp.com
        run: npm run build
