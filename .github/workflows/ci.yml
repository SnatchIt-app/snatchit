# CI — quality gate for the Snatch It monorepo (mobile app + Supabase + web).
#
# Runs on every PR into main, and on pushes to any non-main branch so feature
# branches get fast feedback. Nothing in THIS WORKFLOW deploys or touches
# production — see .github/workflows/README.md for what is intentionally
# deferred.
#
# That is a statement about GitHub Actions, NOT about the repository. A second
# deployment path exists outside CI: the Supabase GitHub integration applies
# pending supabase/migrations/** to the PRODUCTION database on every merge to
# main (check name "Supabase Preview", app "Supabase" — the label is
# misleading, it targets production). It put migration 071 into production on
# 2026-08-27 with no approval gate. Until an owner confirms that control is
# off, no migration-bearing PR may merge to main.
# Canonical: docs/operations/DEPLOYMENT_PATHS.md
#
# Least-privilege: read-only token for the whole workflow. No job needs write.
name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches-ignore: [main]

permissions:
  contents: read

# One run per ref; new pushes cancel the in-flight run.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ---------------------------------------------------------------------------
  # quality: TypeScript typecheck + ESLint + vitest unit tests for the mobile
  # app (repo root). Scripts come straight from package.json:
  #   typecheck -> "tsc --noEmit -p ."
  #   lint      -> "expo lint"
  #   test      -> "vitest run"  (money / payout suites in tests/)
  # ---------------------------------------------------------------------------
  quality:
    name: Typecheck / Lint / Unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0

      # -----------------------------------------------------------------------
      # OFFLINE-VERIFY-v1 byte-identity gate (docs-only; touches no database).
      #
      # PHASE_2_EDGE_FUNCTION_SPEC.md §5.4.3 states the offline door admission
      # predicate ONCE, tagged `OFFLINE-VERIFY-v1`, and permits sanctioned
      # mirrors elsewhere under docs/architecture/** on condition that they are
      # reproduced byte-for-byte. Clause 3 of that single-source rule promises
      # "a docs job ... fails the build unless every one is byte-identical".
      # THIS IS THAT JOB. Until it existed the property held by inspection, not
      # by construction — the exact defect class (a control described as
      # structural that is only prose) the C53 correction was raised against.
      #
      # Why the predicate is worth a gate: ratification record C53. Four
      # documents each held an editable copy of the offline door check; one was
      # corrected and the others were not, and the copy that stayed wrong was
      # the one a scanner SDK implements. It carried TWO conjuncts at 3b where
      # FIVE are required, which made the OFFLINE door strictly more permissive
      # than the ONLINE one: it admitted `paid_pending_transfer` and
      # `refund_hold` atoms the online door refuses.
      #
      # Runs first, before `npm ci`, so a broken lockfile cannot take the gate
      # offline. It is a step in an ALREADY-REQUIRED job rather than a new
      # workflow: the check name "Typecheck / Lint / Unit tests" is load-bearing
      # in branch protection (.github/workflows/README.md), so a gate added here
      # blocks merge today with no branch-protection change and no rename.
      #
      # FAIL CLOSED, four ways. Byte-identity alone is not enough:
      #   1. non-vacuity  — a scan over ZERO blocks passes silently forever.
      #      This repo has shipped that bug: a bare UPDATE reported success
      #      against zero rows and every audit that read the migration source
      #      concluded the limits were in place. They were not. Hence a FLOOR.
      #   2. anti-emptying — four blocks emptied together are byte-identical and
      #      four in number. Hence a minimum body size.
      #   3. anti-coordinated-weakening — four copies that all drop conjunct
      #      3b.v are byte-identical too, and that is C53 reproduced exactly.
      #      Hence the content anchors: the gate asserts the predicate's
      #      STRENGTH, not merely its uniformity.
      #   4. normative home — if §5.4.3's own block were deleted, the surviving
      #      mirrors would happily agree with each other. Hence the requirement
      #      that the edge spec contribute at least one block.
      #
      # Ratchets. Raise OFFLINE_VERIFY_MIN_BLOCKS when a mirror is added; NEVER
      # lower it to make a red build pass. Removing a sanctioned mirror is a
      # reviewed decision that lowers it deliberately, in the same commit that
      # removes the mirror and amends §5.4.3's list of sanctioned mirrors.
      # -----------------------------------------------------------------------
      - name: OFFLINE-VERIFY-v1 spec byte-identity gate
        env:
          # Floor, not an equality. 4 today: edge §5.4.3 (normative) + door
          # §9.2 + Wallet §2.3 + Wallet §11.9 — the Wallet spec carries TWO,
          # which is why "three mirrors" and "three documents" are not the same
          # number and why this is counted rather than assumed.
          OFFLINE_VERIFY_MIN_BLOCKS: 4
          # The canonical body is 2017 bytes / 34 lines. This floor exists only
          # to catch a wholesale emptying or truncation of every copy at once;
          # it is not a second copy of the length and must stay well under it.
          OFFLINE_VERIFY_MIN_BODY_BYTES: 1900
          # The normative home. At least one block MUST come from this file.
          OFFLINE_VERIFY_NORMATIVE_FILE: docs/architecture/PHASE_2_EDGE_FUNCTION_SPEC.md
        run: |
          set -uo pipefail

          scan_root="docs/architecture"
          if [ ! -d "$scan_root" ]; then
            echo "::error::${scan_root} does not exist — the OFFLINE-VERIFY-v1 gate cannot certify a tree it cannot read."
            exit 1
          fi

          # Recursive on purpose. _governance/ and _superseded/ are real
          # subdirectories of docs/architecture, and a mirror that lands in one
          # of them must be gated, not silently exempted by a flat glob.
          files_list="$RUNNER_TEMP/ov_files.txt"
          find "$scan_root" -type f -name '*.md' | LC_ALL=C sort > "$files_list"
          files_n=$(wc -l < "$files_list" | tr -d ' ')
          if [ "${files_n:-0}" -eq 0 ]; then
            echo "::error::no .md files found under ${scan_root} — refusing to certify an empty scan."
            exit 1
          fi
          echo "OFFLINE-VERIFY-v1 gate: scanning ${files_n} markdown file(s) under ${scan_root}/"

          ov_awk="$RUNNER_TEMP/ov_scan.awk"
          cat > "$ov_awk" <<'OVAWK'
          # ov_scan.awk — extract every fenced OFFLINE-VERIFY-v1 block under
          # docs/architecture/**.
          #
          # Each qualifying block's body is written VERBATIM to
          # OUTDIR/block_<n>.txt so the hash below is over bytes on disk, not
          # over anything this script re-serialised. Emits on stdout:
          #
          #   BLOCK        <n> <file> <open_line> <body_lines> <outfile>
          #   LOOSE        <file> <line> <source>
          #   UNTERMINATED <file> <open_line>
          #   TOTALS       <blocks> <loose> <unterminated>
          #
          # A block QUALIFIES when its FIRST body line begins with the tag. That
          # is the same rule §5.4.3 clause 2 states for a sanctioned mirror
          # ("inside a fence whose first line is the OFFLINE-VERIFY-v1 tag"), so
          # the gate and the prose agree on what a mirror is.
          #
          # LOOSE: the tag at column 1 OUTSIDE any fence. That is a mirror whose
          # fence was lost — the copy is still there and still editable, but it
          # is no longer gated. Under a count-only check it would vanish from
          # the census; here it is a hard failure.
          #
          # UNTERMINATED: a fence opened and never closed. FAIL CLOSED — an
          # unterminated fence silently swallows the rest of the file, so every
          # later block in it disappears from the scan.

          BEGIN { blocks = 0; loose = 0; unterm = 0; infence = 0 }

          FNR == 1 {
            if (infence) { printf "UNTERMINATED\t%s\t%d\n", curfile, openline; unterm++ }
            infence = 0; nbody = 0
            curfile = FILENAME
          }

          {
            line = $0
            isfence = 0
            if (match(line, /^`+/) && RLENGTH >= 3)      { isfence = 1; mchar = "`"; mlen = RLENGTH }
            else if (match(line, /^~+/) && RLENGTH >= 3) { isfence = 1; mchar = "~"; mlen = RLENGTH }

            # Opening fence. An info string ("```text") is allowed and is NOT
            # part of the body, so a mirror may be fenced as ```text or ``` and
            # still be byte-identical to the normative block.
            if (isfence && !infence) {
              infence = 1; fencechar = mchar; fencelen = mlen
              openline = FNR; nbody = 0; bodyfirst = ""
              next
            }

            # Closing fence: same character, at least as long, nothing after it.
            # A shorter or different marker inside the fence is body text, which
            # is what lets a fenced block quote a fence.
            if (isfence && infence && mchar == fencechar && mlen >= fencelen && substr(line, mlen + 1) ~ /^[ \t]*$/) {
              if (nbody > 0 && bodyfirst ~ /^OFFLINE-VERIFY-v1/) {
                blocks++
                out = OUTDIR "/block_" blocks ".txt"
                for (i = 1; i <= nbody; i++) print bodyline[i] > out
                close(out)
                printf "BLOCK\t%d\t%s\t%d\t%d\t%s\n", blocks, FILENAME, openline, nbody, out
              }
              infence = 0; nbody = 0; bodyfirst = ""
              next
            }

            if (infence) {
              nbody++
              bodyline[nbody] = line
              if (nbody == 1) bodyfirst = line
              next
            }

            if (line ~ /^OFFLINE-VERIFY-v1/) { loose++; printf "LOOSE\t%s\t%d\t%s\n", FILENAME, FNR, line }
          }

          END {
            if (infence) { printf "UNTERMINATED\t%s\t%d\n", FILENAME, openline; unterm++ }
            printf "TOTALS\t%d\t%d\t%d\n", blocks + 0, loose + 0, unterm + 0
          }
          OVAWK

          ov_out="$RUNNER_TEMP/ov_blocks"
          rm -rf "$ov_out"; mkdir -p "$ov_out"
          ov_index="$RUNNER_TEMP/ov_index.txt"

          # A bash array rather than xargs: one awk invocation (the block
          # counter and OUTDIR numbering are global across files), safe with
          # spaces in paths, and identical on GNU and BSD userlands so a
          # developer can run this exact logic locally before pushing.
          ov_files=()
          while IFS= read -r f; do ov_files+=("$f"); done < "$files_list"
          if ! awk -v OUTDIR="$ov_out" -f "$ov_awk" "${ov_files[@]}" > "$ov_index"; then
            echo "::error::the OFFLINE-VERIFY-v1 scanner failed to run — refusing to certify the spec set as consistent."
            exit 1
          fi

          # sha256sum on the runner; shasum is the BSD/macOS fallback so the
          # gate is reproducible by hand off-CI. Neither is optional.
          if command -v sha256sum >/dev/null 2>&1; then
            ov_sha() { sha256sum "$1" | cut -d' ' -f1; }
          elif command -v shasum >/dev/null 2>&1; then
            ov_sha() { shasum -a 256 "$1" | cut -d' ' -f1; }
          else
            echo "::error::neither sha256sum nor shasum is available — refusing to certify byte-identity without a hash."
            exit 1
          fi

          totals=$(grep -m1 '^TOTALS' "$ov_index" || true)
          if [ -z "$totals" ]; then
            echo "::error::the OFFLINE-VERIFY-v1 scanner produced no TOTALS line — refusing to certify the spec set as consistent."
            exit 1
          fi
          found=$(printf '%s\n' "$totals" | cut -f2)
          loose=$(printf '%s\n' "$totals" | cut -f3)
          unterm=$(printf '%s\n' "$totals" | cut -f4)
          for v in "$found" "$loose" "$unterm"; do
            case "$v" in
              ''|*[!0-9]*) echo "::error::the OFFLINE-VERIFY-v1 scanner emitted a non-numeric total (\"$v\") in: $totals"; exit 1 ;;
            esac
          done

          awk -F'\t' '$1 == "BLOCK" { printf "  block %s  %s:%s  (%s lines)\n", $2, $3, $4, $5 }' "$ov_index"

          # Guard 1 — a fence that never closed. Fail before counting anything.
          if [ "$unterm" -gt 0 ]; then
            echo "::error::${unterm} unterminated code fence(s) under ${scan_root} — every block after one is invisible to this scan."
            awk -F'\t' '$1 == "UNTERMINATED" { printf "  %s: fence opened at line %s never closed\n", $2, $3 }' "$ov_index"
            exit 1
          fi

          # Guard 2 — the tag at column 1 outside a fence: an ungated copy.
          if [ "$loose" -gt 0 ]; then
            echo "::error::${loose} OFFLINE-VERIFY-v1 tag(s) at column 1 outside any code fence. An unfenced copy is an ungated copy — it is exactly the fourth editable copy C53 was raised about. Re-fence it, or delete it and cite §5.4.3."
            awk -F'\t' '$1 == "LOOSE" { printf "  %s:%s  %s\n", $2, $3, $4 }' "$ov_index"
            exit 1
          fi

          # Guard 3 — NON-VACUITY. A scan over zero blocks is not a pass.
          if [ "${found:-0}" -lt "$OFFLINE_VERIFY_MIN_BLOCKS" ]; then
            echo "::error::found ${found} OFFLINE-VERIFY-v1 block(s), floor is ${OFFLINE_VERIFY_MIN_BLOCKS}. Either a sanctioned mirror was deleted or renamed out of ${scan_root}, or the tag was altered so the scan no longer sees it. A gate that scans nothing passes forever — that is why this is a floor and not a comparison against whatever happens to be there."
            exit 1
          fi

          # Guard 4 — the normative home must still exist and still be tagged.
          normative_n=$(awk -F'\t' -v f="$OFFLINE_VERIFY_NORMATIVE_FILE" '$1 == "BLOCK" && $3 == f { n++ } END { print n + 0 }' "$ov_index")
          if [ "${normative_n:-0}" -lt 1 ]; then
            echo "::error::no OFFLINE-VERIFY-v1 block found in ${OFFLINE_VERIFY_NORMATIVE_FILE} — the normative home (§5.4.3). Without it the mirrors would agree with each other and with nothing authoritative."
            exit 1
          fi
          # The normative block's index, used below as the diff base.
          norm_n=$(awk -F'\t' -v f="$OFFLINE_VERIFY_NORMATIVE_FILE" '$1 == "BLOCK" && $3 == f { print $2; exit }' "$ov_index")

          # Guard 5 — BYTE-IDENTITY. The gate §5.4.3 clause 3 promises.
          hash_list="$RUNNER_TEMP/ov_hashes.txt"
          : > "$hash_list"
          while IFS=$'\t' read -r _tag n file openline _lines out; do
            printf '%s\t%s\t%s:%s\n' "$(ov_sha "$out")" "$n" "$file" "$openline" >> "$hash_list"
          done < <(awk -F'\t' '$1 == "BLOCK"' "$ov_index")

          distinct=$(cut -f1 "$hash_list" | LC_ALL=C sort -u | wc -l | tr -d ' ')
          canonical=$(awk -F'\t' -v n="$norm_n" '$2 == n { print $1; exit }' "$hash_list")
          body_bytes=$(wc -c < "$ov_out/block_${norm_n}.txt" | tr -d ' ')

          {
            echo ""
            echo "### OFFLINE-VERIFY-v1 spec byte-identity gate"
            echo ""
            echo "| metric | value | gate |"
            echo "|---|---|---|"
            echo "| tagged blocks found | ${found} | at least ${OFFLINE_VERIFY_MIN_BLOCKS} |"
            echo "| distinct body hashes | ${distinct} | exactly 1 |"
            echo "| canonical body bytes | ${body_bytes} | at least ${OFFLINE_VERIFY_MIN_BODY_BYTES} |"
            echo "| unfenced tags at column 1 | ${loose} | 0 (fail closed) |"
            echo "| unterminated fences | ${unterm} | 0 (fail closed) |"
            echo "| canonical sha256 | \`${canonical}\` | — |"
          } >> "$GITHUB_STEP_SUMMARY"

          if [ "${distinct:-0}" -ne 1 ]; then
            echo "::error::the ${found} OFFLINE-VERIFY-v1 blocks are NOT byte-identical (${distinct} distinct bodies). §5.4.3 is the single normative statement; a mirror that differs is a defect in that mirror, never a change to the predicate. Copy §5.4.3's block verbatim."
            LC_ALL=C sort "$hash_list" | awk -F'\t' '{ printf "  %s  %s\n", substr($1,1,16), $3 }'
            echo "--- each divergent body, diffed against the normative block ---"
            while IFS=$'\t' read -r _h n where; do
              [ "$n" = "$norm_n" ] && continue
              if ! cmp -s "$ov_out/block_${norm_n}.txt" "$ov_out/block_${n}.txt"; then
                echo "### ${where}"
                diff -u "$ov_out/block_${norm_n}.txt" "$ov_out/block_${n}.txt" | head -60 || true
              fi
            done < "$hash_list"
            exit 1
          fi

          # Guard 6 — ANTI-EMPTYING. Four empty blocks are byte-identical and
          # four in number, and would sail through every guard above.
          if [ "${body_bytes:-0}" -lt "$OFFLINE_VERIFY_MIN_BODY_BYTES" ]; then
            echo "::error::the OFFLINE-VERIFY-v1 body is ${body_bytes} bytes, floor is ${OFFLINE_VERIFY_MIN_BODY_BYTES}. Identical copies of a truncated predicate are still identical — uniformity is not strength."
            exit 1
          fi

          # Guard 7 — ANTI-COORDINATED-WEAKENING. This is the guard that would
          # have caught C53 itself. Byte-identity says the four copies agree; it
          # says nothing about WHAT they agree on. Four copies that all drop
          # conjunct 3b.v are byte-identical, four in number, and full length —
          # and the offline door is once again strictly more permissive than the
          # online one. Each anchor below is a load-bearing clause of the
          # ratified predicate (ratification record C53). Editing this list is a
          # reviewed change to the predicate, made in §5.4.3 first.
          anchors="$RUNNER_TEMP/ov_anchors.txt"
          cat > "$anchors" <<'OVANCHORS'
          Single source: PHASE_2_EDGE_FUNCTION_SPEC.md
          The device MUST evaluate against the APPLIED set.
          3b   FIVE conjuncts, ALL required
          i    atom ∈ M2
          ii   M2[atom] carries no applied
          iii  token.credential_version == M2[atom].credential_version
          iv   M2[atom].ticket_state  == 'active'
          v    M2[atom].resale_state  == 'none'
          3c   token.key_id == M2[atom].signing_key_id
          MUST NOT admit
          OVANCHORS
          anchors_n=$(grep -c . "$anchors" | tr -d ' ')
          if [ "${anchors_n:-0}" -lt 10 ]; then
            echo "::error::the anchor list has ${anchors_n} entries, expected at least 10 — the heredoc was truncated and this guard would be vacuous."
            exit 1
          fi
          missing=0
          while IFS= read -r anchor; do
            [ -z "$anchor" ] && continue
            if ! grep -qF -- "$anchor" "$ov_out/block_${norm_n}.txt"; then
              echo "::error::OFFLINE-VERIFY-v1 no longer contains the required clause: ${anchor}"
              missing=$((missing + 1))
            fi
          done < "$anchors"
          if [ "$missing" -gt 0 ]; then
            echo "::error::${missing} load-bearing clause(s) missing from the predicate. All ${found} copies agreeing is not a defence — C53 is precisely the case where the offline door was weakened and every copy of it read consistently. Conjunct 3b.v in particular is load-bearing, not defence in depth: without it the offline door admits paid_pending_transfer and refund_hold atoms the ONLINE door refuses."
            exit 1
          fi

          echo "OFFLINE-VERIFY-v1 gate OK: ${found} tagged block(s) (floor ${OFFLINE_VERIFY_MIN_BLOCKS}), 1 distinct body, ${body_bytes} bytes (floor ${OFFLINE_VERIFY_MIN_BODY_BYTES}), ${anchors_n} clause anchors present, ${loose} unfenced tags, ${unterm} unterminated fences; sha256=${canonical}"

      # ---------------------------------------------------------------------
      # Precedence gate — owner ruling OR-6 (ODR-7 / O11: HYBRID PRECEDENCE).
      #
      # OR-6 rule 4 is not advice: "an unresolved same-tier contradiction must
      # FAIL CI / readiness, be registered, and be resolved explicitly. The
      # implementer does not choose." A rule that only lives in prose is the
      # defect class this corpus keeps re-discovering (C53: four editable copies
      # of one predicate, one corrected, three not). So the rule gets a gate.
      #
      # Deliberately small: one parseable map, one script, this existing
      # required job. It checks six mechanical properties and refuses to guess
      # about anything else.
      #
      # --selftest runs FIRST and is the anti-vacuity control. It drives seven
      # deliberately-broken fixtures through the checkers and fails the build if
      # any of them PASSES. A parser that silently matches nothing therefore
      # cannot go green — which is exactly how a gate like this dies quietly.
      #
      # Runs before `npm ci`, alongside the OFFLINE-VERIFY gate, so a broken
      # lockfile cannot take the governance gates down with it.
      - name: Precedence gate (OR-6 / ODR-7)
        run: |
          set -euo pipefail
          python3 scripts/precedence_gate.py --selftest
          python3 scripts/precedence_gate.py

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install (clean, from lockfile)
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Unit tests
        run: npm run test

  # ---------------------------------------------------------------------------
  # db: prove the migration chain applies cleanly on a FRESH database.
  #
  # These migrations are Supabase-flavoured SQL: they reference the auth /
  # storage schemas, auth.users, and the anon / authenticated / service_role
  # roles. A plain `postgres:17` container does NOT provide those, so we bring
  # up the real Supabase local stack via the CLI, which applies every file in
  # supabase/migrations/ in version order on a brand-new DB. If any migration
  # errors, `supabase start` exits non-zero and this job fails.
  # ---------------------------------------------------------------------------
  db:
    name: Migrations apply cleanly (fresh DB)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # SINGLE SOURCE OF TRUTH for the CLI pin. Both the installer input and the
    # drift assertion below read this one value — never repeat the literal.
    env:
      SUPABASE_CLI_VERSION: 2.115.0
    steps:
      - name: Checkout
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0

      - name: Install Supabase CLI
        uses: supabase/setup-cli@46f7f98c7f948ad727d22c1e67fab04c223a0520 # v3.0.0
        with:
          # PINNED — never `latest`. The migration chain's replay order is a
          # correctness property of this repo; it must not float with tooling.
          # 2.115.0 is the version whose ordering behaviour was verified against
          # the normalized (Scheme B) chain. Upgrades require a deliberate PR:
          # bump pin -> fresh replay green -> Gate-2 parity green -> merge.
          # The value lives in the job-level env above.
          version: ${{ env.SUPABASE_CLI_VERSION }}

      # Toolchain assertion — runs BEFORE anything migration-sensitive.
      # `supabase/setup-cli` resolving to something other than the pin (input
      # typo, action behaviour change, a cached/preinstalled binary earlier on
      # PATH) would silently replay the chain on an unverified tool. Fail loudly
      # instead. `--version` prints the bare version on stdout ("2.115.0"); an
      # upgrade-available notice goes to stderr, so stderr is discarded. The
      # comparison itself is exact — no prefix/substring matching.
      - name: Assert pinned Supabase CLI (toolchain drift gate)
        run: |
          set -euo pipefail
          echo "supabase binary : $(command -v supabase)"
          # `|| true` so a non-zero/absent CLI falls through to the explicit
          # empty-output error below rather than dying silently under pipefail.
          actual="$( { supabase --version 2>/dev/null || true; } | head -n1 | tr -d '[:space:]' | sed 's/^[vV]//')"
          echo "supabase CLI    : expected=${SUPABASE_CLI_VERSION} actual=${actual}"
          if [ -z "$actual" ]; then
            echo "::error::Could not determine the Supabase CLI version (\`supabase --version\` produced no output on stdout)."
            exit 1
          fi
          if [ "$actual" != "$SUPABASE_CLI_VERSION" ]; then
            echo "::error::Supabase CLI version drift: expected ${SUPABASE_CLI_VERSION}, got ${actual}. The migration chain's replay order is only verified against the pin — fix the pin or re-verify the chain, do not float the tool."
            exit 1
          fi
          echo "OK: Supabase CLI matches the pin (${SUPABASE_CLI_VERSION})."

      # supabase/config.toml is not committed; create it if absent. Non-interactive
      # in CI (no TTY). Ensure [db].major_version = 17 to match production.
      - name: Ensure Supabase project config
        run: |
          if [ ! -f supabase/config.toml ]; then
            supabase init
          fi

      # Boot the local stack. Migrations in supabase/migrations/ are applied on
      # first start; a failure in any migration fails this step. We exclude
      # cosmetic / non-schema services to keep the run fast — everything that
      # creates schema (db, auth, storage, rest, realtime, pooler) stays up.
      - name: Apply migration chain on fresh DB
        run: |
          supabase start \
            -x studio,inbucket,imgproxy,edge-runtime,logflare,vector

      - name: Show applied migrations
        if: always()
        run: supabase migration list || true

      # Discovery proof: the CLI must apply EVERY file in supabase/migrations.
      # A skipped file (unparseable name) is a silent wrong-schema hazard — it is
      # exactly how the letter-suffixed chain used to "pass" while being wrong.
      - name: Migration discovery proof (zero skipped, zero duplicates)
        run: |
          set -euo pipefail
          files=$(ls supabase/migrations/*.sql | wc -l | tr -d ' ')
          applied=$(psql "$DB_URL" -tAc "select count(*) from supabase_migrations.schema_migrations;")
          dupes=$(ls supabase/migrations/*.sql | xargs -n1 basename | sed 's/_.*//' | sort | uniq -d | wc -l | tr -d ' ')
          echo "migration files on disk : $files"
          echo "applied by the CLI      : $applied"
          echo "duplicate versions      : $dupes"
          if [ "$files" != "$applied" ]; then
            echo "::error::CLI applied $applied of $files migrations — some were SKIPPED (unparseable filename)."; exit 1
          fi
          if [ "$dupes" != "0" ]; then echo "::error::duplicate version prefixes"; exit 1; fi
          echo "OK: every migration discovered and applied; no duplicates."
        env:
          DB_URL: postgresql://postgres:postgres@127.0.0.1:54322/postgres

      # Gate-2 parity: the freshly replayed schema must match the certified
      # Phase-0 baseline. Counts are printed for the PR record; drift fails.
      - name: Gate-2 parity (fresh replay vs certified baseline)
        run: |
          set -euo pipefail
          q() { psql "$DB_URL" -tAc "$1" | tr -d ' '; }
          tables=$(q "select count(*) from pg_tables where schemaname='public';")
          funcs=$(q "select count(*) from pg_proc p join pg_namespace n on n.oid=p.pronamespace where n.nspname='public';")
          policies=$(q "select count(*) from pg_policies where schemaname='public';")
          triggers=$(q "select count(*) from pg_trigger t join pg_class c on c.oid=t.tgrelid join pg_namespace n on n.oid=c.relnamespace where n.nspname='public' and not t.tgisinternal;")
          echo "tables=$tables functions=$funcs policies=$policies triggers=$triggers"
          echo "GATE2_COUNTS tables=$tables functions=$funcs policies=$policies triggers=$triggers" >> "$GITHUB_STEP_SUMMARY"
          fail=0
          [ "$tables"   -eq "$EXPECT_TABLES" ]   || { echo "::error::tables $tables != $EXPECT_TABLES (Gate-2 drift)"; fail=1; }
          [ "$funcs"    -eq "$EXPECT_FUNCS" ]    || { echo "::error::functions $funcs != $EXPECT_FUNCS (Gate-2 drift)"; fail=1; }
          [ "$policies" -eq "$EXPECT_POLICIES" ] || { echo "::error::policies $policies != $EXPECT_POLICIES (Gate-2 drift)"; fail=1; }
          [ "$triggers" -eq "$EXPECT_TRIGGERS" ] || { echo "::error::triggers $triggers != $EXPECT_TRIGGERS (Gate-2 drift)"; fail=1; }
          exit $fail
        env:
          DB_URL: postgresql://postgres:postgres@127.0.0.1:54322/postgres
          # Certified Phase-0 Gate-2 baseline (PHASE_0_GATE2_SCHEMA_DIFF.md).
          # 2026-08-27, migration 072 (H-1): functions 68 -> 69 and triggers
          # 23 -> 24. 072 is purely additive — it creates exactly one function
          # (guard_listing_insert_columns) and one trigger
          # (trg_guard_listing_insert on public.listings) and alters nothing that
          # already existed. Until 072 is applied to production, the fresh replay
          # is intentionally ONE function and ONE trigger ahead of the production
          # catalog; that gap closes on apply. Tables and policies are unchanged.
          EXPECT_TABLES: 27
          EXPECT_FUNCS: 69
          EXPECT_POLICIES: 37
          EXPECT_TRIGGERS: 24

      # Privilege-parity diagnostic. Production's table grants come from Supabase's
      # DEFAULT PRIVILEGES, not from the migration chain (migration 063 says so
      # explicitly), so the chain cannot reproduce them from source. If the fresh
      # stack does not have them, the security suite tests a DIFFERENT privilege
      # surface than production -- and "anon cannot read X" would pass because the
      # grant is missing, not because RLS works. That is a vacuous pass, so this
      # step measures the gap before the suite runs.
      # Apply the production privilege surface to the fresh database, then PROVE
      # it matches. See supabase/ci/parity_grants.sql for the full rationale
      # (finding REPLAY-1): production's table grants come from Supabase's
      # environment bootstrap, not from the migration chain, so a fresh replay
      # has almost no grants. Without this, most of the security suite would pass
      # because the GRANT is missing rather than because RLS works.
      - name: Privilege parity with production (CI-only bootstrap)
        run: |
          set -euo pipefail
          echo "--- BEFORE (fresh replay, grants from the migration chain alone) ---"
          psql "$DB_URL" -tA -c "
            select grantee||' '||count(distinct table_name)||' tables'
            from information_schema.role_table_grants
            where table_schema='public' and grantee in ('anon','authenticated','service_role')
              and privilege_type='SELECT' group by grantee order by grantee;"
          psql "$DB_URL" -v ON_ERROR_STOP=1 -q -f supabase/ci/parity_grants.sql
          echo "--- AFTER: full matrix must equal supabase/ci/expected_grants.txt ---"
          psql "$DB_URL" -tA -F'|' -c "
            select grantee, table_name, string_agg(privilege_type, ',' order by privilege_type)
            from information_schema.role_table_grants
            where table_schema='public' and grantee in ('anon','authenticated','service_role')
            group by grantee, table_name order by grantee, table_name;" \
            | sed 's/[[:space:]]*$//' | sort > "$RUNNER_TEMP/actual_grants.txt"
          if ! diff -u supabase/ci/expected_grants.txt "$RUNNER_TEMP/actual_grants.txt"; then
            echo "::error::privilege surface does not match production. A count-only check would have missed this — an earlier revision over-granted public.transfers (production is SELECT-only there per migration 055) and silently broke three assertions."
            exit 1
          fi
          echo "OK: $(wc -l < supabase/ci/expected_grants.txt | tr -d ' ') grant rows match the expected fixture (production minus the DRIFT-1 departure)."
          # profiles must remain COLUMN-granted, never table-granted.
          tbl=$(psql "$DB_URL" -tAc "select count(*) from information_schema.role_table_grants where table_schema='public' and table_name='profiles' and grantee in ('anon','authenticated');")
          col=$(psql "$DB_URL" -tAc "select count(*) from information_schema.column_privileges where table_schema='public' and table_name='profiles' and grantee='authenticated' and privilege_type='SELECT';")
          echo "  profiles: client table-level grants=$tbl (must be 0), column-level SELECT=$col (must be > 0)"
          [ "$tbl" = "0" ] || { echo "::error::profiles gained a table-level client grant — column restrictions bypassed"; exit 1; }
          [ "$col" -gt 0 ] || { echo "::error::profiles lost its column-level grants"; exit 1; }
        env:
          DB_URL: postgresql://postgres:postgres@127.0.0.1:54322/postgres

      # SEC-2 default-ACL gate. Closes the vacuous-pass hole in the step above.
      # That diff compares the replay against expected_grants.txt, which is
      # sound for tables on both sides and VACUOUS for a table on neither: a NEW
      # table gets no grants on the fresh replay and no fixture line, so
      # zero-vs-zero passes green — while on production pg_default_acl silently
      # grants anon/authenticated full DML to it. That is how webhook_retries
      # drifted (SEC-1, reconciled by migration 074).
      #
      # Covers FUNCTIONS too, and that half is the more exposed one (F2): the
      # same pg_default_acl grants anon=X on every new function in public, which
      # PostgREST serves at POST /rest/v1/rpc/<name> to anyone holding the
      # publishable anon key. A new table at least still has RLS in front of it.
      # Unlike the table half, the function half is NOT vacuous on the fresh
      # replay: proacl IS NULL means defaults apply, and the function default is
      # PUBLIC EXECUTE, so a missing REVOKE is detectable here on CI.
      #
      # Fails CLOSED for any public table or function with no recorded decision.
      # Purely additive: it asserts nothing the other steps already assert, and
      # it changes no ratchet. It runs BEFORE the pgTAP step so the catalog it
      # reads is the migration chain's output, with no pgTAP objects installed.
      # The script is an assertion, never a migration — it grants and revokes
      # nothing. `-v ON_ERROR_STOP=1` plus `set -e` makes any RAISE EXCEPTION
      # fail the job; `psql -f` alone would exit 0 on a failed statement.
      - name: Public table + function grant decisions recorded (fails closed)
        run: |
          set -euo pipefail
          test -f supabase/ci/assert_public_table_grant_decisions.sql || {
            echo "::error::supabase/ci/assert_public_table_grant_decisions.sql is missing — the SEC-2 default-ACL gate would silently pass."
            exit 1
          }
          psql "$DB_URL" -v ON_ERROR_STOP=1 -f supabase/ci/assert_public_table_grant_decisions.sql
          echo "OK: every public table and function carries a recorded, asserted grant decision (SEC-2 / F2)."
        env:
          DB_URL: postgresql://postgres:postgres@127.0.0.1:54322/postgres

      # pgTAP database security gate. Runs against the SAME freshly-replayed
      # stack booted above, so it costs no second boot and is guaranteed to be
      # testing the schema this PR actually produces.
      #
      # This step deliberately lives inside the existing `db` job rather than a
      # new one: `Migrations apply cleanly (fresh DB)` is already a REQUIRED
      # status check, so a pgTAP failure blocks merge immediately. Adding a
      # separate job would mean a second required context that reports nothing
      # until it has run once — the "disappearing required check" deadlock this
      # repo already fixed for the migrations guard. Do NOT rename this job.
      - name: pgTAP database security suite
        run: |
          set -euo pipefail
          if ! ls supabase/tests/*.sql >/dev/null 2>&1; then
            echo "::error::supabase/tests/*.sql missing — the security gate would silently pass."
            exit 1
          fi
          files=$(ls supabase/tests/*.sql | wc -l | tr -d ' ')
          planned=$(grep -ho 'plan([0-9]*)' supabase/tests/*.sql | grep -o '[0-9]*' | paste -sd+ - | bc)
          echo "test files: $files    planned assertions: $planned"
          supabase test db --local 2>&1 | tee "$RUNNER_TEMP/tap.txt"

      # Parse the TAP stream for the record. `set -o pipefail` above already
      # fails the job on a non-zero pg_prove exit; this makes the numbers
      # explicit in the PR so "green" can never mean "the files merely exist".
      - name: pgTAP result summary
        if: always()
        run: |
          set -uo pipefail
          f="$RUNNER_TEMP/tap.txt"
          [ -f "$f" ] || { echo "::error::no TAP output captured — the suite did not run."; exit 1; }
          # >>> MASK-GATE-CONSTANTS-BEGIN
          # Masking ratchets. Declared up here rather than beside the gate so the
          # step-summary table below can state the ratchet it is actually gated
          # on (it previously printed "not gating", which stopped being true the
          # moment the runtime guard landed).
          # These are CEILINGS, all five. Raising one to make a red build pass
          # defeats the gate; that is the failure mode this whole block exists to
          # prevent. LOWERING one — when a pinned finding is finally fixed and the
          # todo() comes out — is the intended direction of travel, and is a
          # deliberate, separate, reviewed act: the gate stays green if a todo()
          # is removed without lowering the ratchet, so nothing forces the bump
          # and nothing about it can be accidental.
          # Current truth, computed from the tree (see the OK line the gate
          # prints): 2 todo() calls masking 2 assertions, 0 skip(), 0 todo_start.
          MASK_MAX_TODO_FAILURES=2      # runtime: '# Failed (TODO) test' lines in the TAP stream
          MASK_MAX_TODO_CALLS=2         # static:  number of todo(...) call sites
          MASK_MAX_MASKED_ASSERTIONS=2  # static:  SUM of how_many over all todo(...) calls
          MASK_MAX_SKIP_CALLS=0         # static:  skip(...) call sites — banned
          MASK_MAX_TODO_BLOCKS=0        # static:  todo_start(/todo_end( — banned, unbounded by construction
          # >>> MASK-GATE-CONSTANTS-END
          # pg_prove prints a per-file summary and a "Files=N, Tests=N" footer,
          # NOT raw TAP ok/not ok lines. Parsing for '^ok' yields 0/0/0/0 and
          # would report a clean sheet for a suite that never ran -- exactly the
          # vacuous-green this gate exists to prevent. Parse what pg_prove emits.
          # Report ONLY what pg_prove actually emits. An earlier version of this
          # step printed passed/failed/skipped/todo counts it could not measure:
          # it grepped for raw TAP '^not ok' and '# TODO' lines, which pg_prove
          # never prints, so failed/skipped/todo were permanently 0 and "passed"
          # was assigned the number of tests RUN. It printed passed=214 failed=0
          # for a run that had 212 passing and 2 failing-but-TODO. Worse, wrapping
          # any future failing security assertion in todo() would have kept the
          # gate green AND counted it as passed. The real gate is result=PASS plus
          # assertions-run == assertions-planned; claim nothing beyond that.
          files_n=$(grep -oE 'Files=[0-9]+' "$f" | tail -1 | cut -d= -f2 || true)
          tests_n=$(grep -oE 'Tests=[0-9]+' "$f" | tail -1 | cut -d= -f2 || true)
          result=$(grep -oE '^Result: (PASS|FAIL|NOTESTS)' "$f" | tail -1 | awk '{print $2}' || true)
          failing_files=$(grep -cE '\(Wstat: ' "$f" || true)
          badplan=$(grep -cE 'Parse errors: Bad plan' "$f" || true)
          todo_fail=$(grep -cE '# Failed \(TODO\) test' "$f" || true)
          echo "files=$files_n tests_ran=$tests_n result=$result failing_files=$failing_files bad_plans=$badplan todo_failing=$todo_fail"
          {
            echo "### pgTAP database security gate"
            echo ""
            echo "| metric | value |"
            echo "|---|---|"
            echo "| test files | ${files_n:-?} |"
            echo "| assertions executed | ${tests_n:-?} |"
            echo "| files with failures | ${failing_files:-?} |"
            echo "| bad plans | ${badplan:-?} |"
            echo "| failing-but-TODO (GATED — ratchet: at most ${MASK_MAX_TODO_FAILURES}) | ${todo_fail:-?} |"
            echo "| pg_prove result | ${result:-none} |"
          } >> "$GITHUB_STEP_SUMMARY"
          if [ "${result:-}" != "PASS" ] || [ "${badplan:-0}" -gt 0 ]; then
            echo "::error::pgTAP did not pass cleanly (result=${result:-none}, bad plans=${badplan:-0}, failing files=${failing_files:-0})."
            grep -aE 'Parse errors|Failed [0-9]+/|not ok |ERROR:|Result:' "$f" | head -40
            exit 1
          fi
          planned_total=$(grep -ho 'plan([0-9]*)' supabase/tests/*.sql | grep -o '[0-9]*' | paste -sd+ - | bc)
          if [ "${tests_n:-0}" != "$planned_total" ]; then
            echo "::error::ran ${tests_n:-0} assertions but $planned_total were planned — some file aborted early."
            exit 1
          fi
          # Coverage floor. Without it, DELETING test files keeps the gate green:
          # both guards above compare the suite against ITSELF (tests run vs plans
          # of the files currently on disk), so they stay consistent as coverage
          # shrinks. These are ratchets — raise them when coverage grows, never
          # lower them to make a red build pass.
          # Ratchets raised 2026-08-27 with supabase/tests/045_listing_insert_authority.sql
          # (H-1): 12 -> 13 files, 214 -> 234 assertions.
          # Ratchets, reconciled across the pre-implementation security series.
          # Baseline before the series was 13 files / 234 assertions.
          #   073 SEC-3 -> 130_storage_bucket_constraints.sql (+1 file, +18) = 14 / 252
          #   074 SEC-1 -> 131_privilege_cleanup.sql          (+1 file, +24) = 15 / 276
          #   075 SEC-4 + D-5 -> 132_replay_parity.sql        (+1 file, +11) = 16 / 287
          # Computed from the tree, not from a note:
          #   ls supabase/tests/*.sql | wc -l                             -> 16
          #   grep -ho 'plan([0-9]*)' supabase/tests/*.sql | ... | bc     -> 287
          # 075's file plans 11, not 12: its first revision had a vacuous cron
          # assertion (an is_empty that passed trivially with zero rows) and two
          # count-only storage checks. Those three were replaced by one
          # non-vacuous drift assertion and two full-SET equality assertions, so
          # the file is one assertion shorter and strictly stronger.
          # Ratchets raised 2026-08-28 with supabase/tests/110_money_authz_matrix.sql
          # (MONEY-1): 16 -> 17 files, 287 -> 305 assertions.
          #   110_money_authz_matrix.sql -> +1 file, plan(18)  = 17 / 305
          # Recomputed from the tree at that commit, not carried from a note:
          #   ls supabase/tests/*.sql | wc -l                             -> 17
          #   grep -ho 'plan([0-9]*)' supabase/tests/*.sql | ... | bc     -> 305
          # The file plans 18, not 17: assertion 17 was re-pointed at a
          # file-local RESERVED listing fixture (against the previous
          # tap.listing_a() target the status<>'reserved' disjunct
          # short-circuited, so it raised the expected message regardless of
          # whose identity was used — it would have stayed green even if the
          # forged p_user_id were honoured), and assertion 18 was added as the
          # matching positive control that proves 17 raises on IDENTITY rather
          # than on listing state. It carries no todo()/skip(), so none of the
          # five masking ratchets below moves.
          # Ratchets raised 2026-08-30 with supabase/tests/140_phase2_outbox_foundation.sql
          # (Phase-2 package 076): 17 -> 18 files, 305 -> 358 assertions.
          # Recomputed from the tree at this commit, not carried from a note:
          #   ls supabase/tests/*.sql | wc -l                             -> 18
          #   grep -ho 'plan([0-9]*)' supabase/tests/*.sql | ... | bc     -> 358
          # The file plans 53: five schemas + nine USAGE booleans + the OR-1
          # inverted-D-1 role assertion + helper/default-priv/envelope catalog
          # checks + hostile-role direct-mutation probes + the OR-14
          # REQUIRED-rollback and BEST-EFFORT-survival transactional proofs +
          # the per-aggregate UNIQUE concurrency backstop.
          # Raised again 2026-08-30 (review hardenings A/B/C/D/E): 140 plans 59.
          # Ratchets raised 2026-08-30 with supabase/tests/141_phase2_identity_orgs_deletion.sql
          # (Phase-2 package 077): 18 -> 19 files, 364 -> 552 assertions.
          # Recomputed from the tree at this commit:
          #   ls supabase/tests/*.sql | wc -l                         -> 19
          #   grep -ho 'plan([0-9]*)' supabase/tests/*.sql | sum      -> 552
          # 141 plans 188: the twelve-table closed world + 15-label role columns
          # + INV-NOFORCE + the 8-policy register + hostile grants + the
          # PFA-1 walled-function ACL sweep + EXEC-set equalities + the eight
          # approval_request CHECKs + AO guards + demographics/contact-pref
          # contracts + org lifecycle + connect bind-once + platform-role
          # PFA-4 posture + the OR-13 deletion machine (request/withdraw/Q5/
          # sweep/BP live arms/terminal entry/ERASED refusals) + R2 emits +
          # the eleven SEAM-2 stub identities.
          MIN_FILES=19
          MIN_ASSERTIONS=552
          [ "${files_n:-0}" -ge "$MIN_FILES" ] || { echo "::error::pgTAP ran ${files_n:-0} files, floor is $MIN_FILES — test files were removed."; exit 1; }
          [ "$planned_total" -ge "$MIN_ASSERTIONS" ] || { echo "::error::suite plans $planned_total assertions, floor is $MIN_ASSERTIONS — coverage was reduced."; exit 1; }
          echo "coverage floor OK: $files_n files >= $MIN_FILES, $planned_total assertions >= $MIN_ASSERTIONS"

          # ── Masking ratchet (REPLAY-1, Agent C) ──────────────────────────
          # >>> MASK-GATE-BEGIN
          # pgTAP todo() failures do NOT fail pg_prove: Result stays PASS and
          # tests_ran still equals planned. Every guard above is therefore blind
          # to a failing security assertion that someone wrapped in todo() — the
          # step already COMPUTES todo_fail and prints it, but nothing gated on
          # it. Confirmed on a live green run (33090393102, tree identical to
          # main at the time) which reported todo_failing=2 and still succeeded.
          #
          # This suite legitimately carries 2, both in 060_payments_money.sql:
          # F-2 (#11, unique index on transfers.stripe_transfer_id) and F-3
          # (#12, payments amount/status guard trigger). See
          # supabase/tests/README.md "Pinned findings".
          #
          # WHY A PARSER AND NOT A grep COUNT.
          # pgTAP's signature is todo(why, how_many): the second argument masks
          # the next how_many assertions. A ratchet on the NUMBER OF todo() CALLS
          # therefore bounds nothing that matters. Editing
          #     SELECT todo('F-2: ...', 1);   ->   SELECT todo('F-2: ...', 20);
          # leaves the call count at 2, leaves the runtime count at 2 (a masked
          # assertion only surfaces as '# Failed (TODO) test' if it FAILS), and
          # silently makes the next twenty currently-PASSING security assertions
          # permanently unfailable. One character, whole gate gone. So the scan
          # below parses how_many out of every call and ratchets on the SUM. The
          # call-count ratchet is kept as well; both must hold.
          #
          # TWO INDEPENDENT VIEWS OF THE SAME FILES, on purpose:
          #   (a) a call parser over the RAW text — bounds how many assertions
          #       are masked. It is context-blind, so it can only OVER-count.
          #   (b) a bare-identifier count over COMMENT-STRIPPED, string-emptied
          #       text — a presence check that no formatting trick can dodge,
          #       because you cannot call todo without writing the word. This is
          #       what closes "SELECT todo\n('X', 20)", "SELECT todo/*c*/(...)"
          #       and "SELECT \"todo\"(...)", all three of which slip past any
          #       identifier-immediately-followed-by-paren rule, grep or
          #       otherwise. It can only UNDER-count (exotic string/comment
          #       states), which is exactly where (a) is strongest.
          # Neither is sufficient alone; both are ratcheted.
          #
          # Scope note (deliberate, not an oversight): the static scan globs
          # supabase/tests/*.sql, non-recursive — identical to every other glob
          # in this job (file count, plan sum, and pg_prove itself), so a .sql
          # file in a subdirectory is neither run, nor counted, nor scanned.
          # Making this one glob recursive on its own would be strictly worse: it
          # would scan files the suite never executes while the coverage floor
          # still ignored them. If tests ever move into subdirectories, every
          # glob in this job changes together.
          mask_awk="$RUNNER_TEMP/mask_scan.awk"
          cat > "$mask_awk" <<'MASKAWK'
          # mask_scan.awk — bound the masking surface of the pgTAP suite.
          #
          # Emits tab-separated records on stdout:
          #   CALL   <file> <line> <todo|skip> <masked_count, or -1 = unparseable> <source>
          #   BLOCK  <file> <line> <todo_start|todo_end> <source>
          #   TOTALS <todo_calls> <masked_assertions> <unparseable> <skip_calls>
          #          <blocks> <todo_words> <skip_words> <block_words>
          #
          # pgTAP signatures handled:
          #   todo(why text, how_many int)  -> how_many
          #   todo(how_many int, why text)  -> how_many
          #   todo(how_many int)            -> how_many
          #   todo(why text)                -> 1
          # ...and the same shapes for skip(), which is banned outright anyway.
          #
          # FAIL CLOSED. Anything the parser cannot bound to a literal integer is
          # reported as -1 (unparseable) and fails the gate. It NEVER silently assumes 1.
          # That covers: an argument list that does not close on the same line, a
          # non-literal count (a cast, an expression, a variable), an argument count or
          # shape pgTAP does not have, and an empty argument list.
          #
          # The CALL/BLOCK scan is deliberately BLUNT about context: it does not decide
          # whether a hit sits in a comment, inside a string literal, or in a $$-quoted
          # body, and a todo( written inside another call's why-string is counted twice.
          # Over-counting is a loud, cheap, one-line fix; under-counting is a silent hole.
          #
          # The word counters are the mirror image: they run over comment-stripped,
          # string-emptied text, so prose is free ("-- ... pinned as TODO." costs
          # nothing) but no amount of whitespace, comment or quoting between the
          # identifier and its "(" can hide a call.

          function trim(s) { sub(/^[ \t]+/, "", s); sub(/[ \t]+$/, "", s); return s }

          function kindof(s) {
            s = trim(s)
            if (s ~ /^[0-9]+$/) return "INT"
            if (length(s) >= 2 && substr(s, 1, 1) == "'" && substr(s, length(s), 1) == "'") return "STR"
            return "UNK"
          }

          # Walk the argument list whose "(" is at position p0 of the current line L.
          # Fills A[1..NA]. Returns 1 if the list closed on this line, else 0.
          function parse_args(p0,   p, ch, cur, depth, instr) {
            depth = 0; cur = ""; NA = 0; instr = 0
            for (p = p0; p <= LN; p++) {
              ch = substr(L, p, 1)
              if (instr) {
                if (ch == "'") {
                  if (substr(L, p + 1, 1) == "'") { cur = cur "''"; p++; continue }
                  instr = 0
                }
                cur = cur ch
                continue
              }
              if (ch == "'") { instr = 1; cur = cur ch; continue }
              if (ch == "(") { depth++; if (depth > 1) cur = cur ch; continue }
              if (ch == ")") {
                depth--
                if (depth == 0) { NA++; A[NA] = cur; return 1 }
                cur = cur ch
                continue
              }
              if (ch == "," && depth == 1) { NA++; A[NA] = cur; cur = ""; continue }
              cur = cur ch
            }
            return 0
          }

          function masked_count(p0,   k1, k2) {
            if (!parse_args(p0)) return -1
            if (NA == 1) {
              k1 = kindof(A[1])
              if (k1 == "INT") return trim(A[1]) + 0
              if (k1 == "STR") return 1
              return -1
            }
            if (NA == 2) {
              k1 = kindof(A[1]); k2 = kindof(A[2])
              if (k1 == "STR" && k2 == "INT") return trim(A[2]) + 0
              if (k1 == "INT" && k2 == "STR") return trim(A[1]) + 0
              return -1
            }
            return -1
          }

          # Remove -- and /* */ comments and empty every string literal, so the word
          # counters below see code and nothing but code. INBLK carries /* */ state
          # across lines. String state deliberately does NOT carry across lines: a
          # literal left open at end of line is a malformed test file, and the blunt
          # CALL scan above still covers it.
          function strip_comments(s,   out, p, n, ch, nx) {
            out = ""; n = length(s); p = 1
            while (p <= n) {
              ch = substr(s, p, 1); nx = substr(s, p + 1, 1)
              if (INBLK) {
                if (ch == "*" && nx == "/") { INBLK = 0; out = out " "; p += 2; continue }
                p++
                continue
              }
              if (ch == "'") {
                out = out "''"
                p++
                while (p <= n) {
                  ch = substr(s, p, 1)
                  if (ch == "'") {
                    if (substr(s, p + 1, 1) == "'") { p += 2; continue }
                    p++
                    break
                  }
                  p++
                }
                continue
              }
              if (ch == "-" && nx == "-") return out " "
              if (ch == "/" && nx == "*") { INBLK = 1; out = out " "; p += 2; continue }
              out = out ch
              p++
            }
            return out
          }

          function count_words(s,   n, p, q, w) {
            n = length(s); p = 1
            while (p <= n) {
              if (substr(s, p, 1) ~ /[A-Za-z_]/) {
                q = p
                while (q <= n && substr(s, q, 1) ~ /[A-Za-z0-9_]/) q++
                w = tolower(substr(s, p, q - p))
                if (w == "todo") todo_words++
                else if (w == "skip") skip_words++
                else if (w == "todo_start" || w == "todo_end") block_words++
                p = q
                continue
              }
              p++
            }
          }

          FNR == 1 { INBLK = 0 }

          {
            L = $0; LN = length(L)
            src = L; gsub(/\t/, " ", src); src = trim(src)
            i = 1
            while (i <= LN) {
              ch = substr(L, i, 1)
              if (ch ~ /[A-Za-z_]/) {
                # Maximal identifier run, lowercased: SQL is case-insensitive, and this is
                # also what keeps todo_start out of the plain-todo bucket (and mytodo( out
                # of both) without any lookahead trickery.
                j = i
                while (j <= LN && substr(L, j, 1) ~ /[A-Za-z0-9_]/) j++
                word = tolower(substr(L, i, j - i))
                # Whitespace between the identifier and its "(" is legal SQL.
                k = j
                while (k <= LN && substr(L, k, 1) ~ /[ \t]/) k++
                if (k <= LN && substr(L, k, 1) == "(") {
                  if (word == "todo_start" || word == "todo_end") {
                    blocks++
                    printf "BLOCK\t%s\t%d\t%s\t%s\n", FILENAME, FNR, word, src
                  } else if (word == "todo" || word == "skip") {
                    c = masked_count(k)
                    if (word == "todo") todo_calls++; else skip_calls++
                    if (c < 0) bad++; else if (word == "todo") masked += c
                    printf "CALL\t%s\t%d\t%s\t%d\t%s\n", FILENAME, FNR, word, c, src
                  }
                }
                i = j
                continue
              }
              i++
            }
            count_words(strip_comments($0))
          }

          END {
            printf "TOTALS\t%d\t%d\t%d\t%d\t%d\t%d\t%d\t%d\n", \
              todo_calls+0, masked+0, bad+0, skip_calls+0, blocks+0, \
              todo_words+0, skip_words+0, block_words+0
          }
          MASKAWK
          mask_out="$RUNNER_TEMP/mask_scan.txt"
          if ! awk -f "$mask_awk" supabase/tests/*.sql > "$mask_out"; then
            echo "::error::the masking scanner failed to run — refusing to certify the suite as unmasked."
            exit 1
          fi
          sed -n 's/^/masking inventory: /p' "$mask_out"
          totals=$(grep -m1 '^TOTALS' "$mask_out" || true)
          if [ -z "$totals" ]; then
            echo "::error::the masking scanner produced no TOTALS line — refusing to certify the suite as unmasked."
            exit 1
          fi
          todo_calls=$(printf '%s\n' "$totals" | cut -f2)
          masked_assertions=$(printf '%s\n' "$totals" | cut -f3)
          unparseable=$(printf '%s\n' "$totals" | cut -f4)
          skip_calls=$(printf '%s\n' "$totals" | cut -f5)
          todo_blocks=$(printf '%s\n' "$totals" | cut -f6)
          todo_words=$(printf '%s\n' "$totals" | cut -f7)
          skip_words=$(printf '%s\n' "$totals" | cut -f8)
          block_words=$(printf '%s\n' "$totals" | cut -f9)
          for v in "$todo_calls" "$masked_assertions" "$unparseable" "$skip_calls" \
                   "$todo_blocks" "$todo_words" "$skip_words" "$block_words"; do
            case "$v" in
              ''|*[!0-9]*) echo "::error::the masking scanner emitted a non-numeric total (\"$v\") in: $totals"; exit 1 ;;
            esac
          done
          {
            echo ""
            echo "| masking metric | value | ratchet |"
            echo "|---|---|---|"
            echo "| todo() calls | ${todo_calls} | at most ${MASK_MAX_TODO_CALLS} |"
            echo "| assertions masked by todo() | ${masked_assertions} | at most ${MASK_MAX_MASKED_ASSERTIONS} |"
            echo "| \`todo\` identifiers outside comments | ${todo_words} | at most ${MASK_MAX_TODO_CALLS} |"
            echo "| skip() calls / \`skip\` identifiers | ${skip_calls} / ${skip_words} | at most ${MASK_MAX_SKIP_CALLS} |"
            echo "| todo_start()/todo_end() calls / identifiers | ${todo_blocks} / ${block_words} | at most ${MASK_MAX_TODO_BLOCKS} |"
            echo "| todo()/skip() with an unparseable count | ${unparseable} | 0 (fail closed) |"
          } >> "$GITHUB_STEP_SUMMARY"

          # Runtime guard: a masked assertion that is CURRENTLY FAILING.
          # LOWER MASK_MAX_TODO_FAILURES when a pinned finding is fixed; NEVER
          # raise it to make a red build pass. Adding a genuinely new pinned gap
          # is a reviewed decision, not a ratchet bump of convenience.
          # Re-checked against the merged suite 2026-08-28:
          # 110_money_authz_matrix.sql adds 18 assertions and NO todo() (F-2/F-3
          # are recorded as not-implemented rather than re-marked), so the count
          # stays at 2.
          if [ "${todo_fail:-0}" -gt "$MASK_MAX_TODO_FAILURES" ]; then
            echo "::error::${todo_fail} failing-but-TODO assertions, ratchet is $MASK_MAX_TODO_FAILURES — a failing assertion was masked with todo()."
            grep -aE '# Failed \(TODO\) test' "$f" | head -20 || true
            exit 1
          fi

          # Static guard 1 — FAIL CLOSED. An unbounded or unrecognised mask is
          # never assumed to be 1. This is what stops "todo('x', <expr>)" or a
          # call split across lines from slipping past the sum below.
          if [ "$unparseable" -gt 0 ]; then
            echo "::error::${unparseable} todo()/skip() call(s) whose masked-assertion count could not be parsed. An unbounded mask is not assumed to be 1 — write the call on one line with a literal integer count, e.g. SELECT todo('why', 1);"
            grep -E '^CALL' "$mask_out" | awk -F'\t' '$5 < 0 { printf "  %s:%s  %s\n", $2, $3, $6 }' || true
            exit 1
          fi

          # Static guard 2 — todo_start()/todo_end() banned outright. The block
          # form masks every assertion until todo_end() (or end of file), so the
          # size of the mask is a property of the whole file, not of the call:
          # it cannot be statically bounded, and a later commit can widen it to
          # anything by moving one line. There is no place for it in this suite.
          if [ "$todo_blocks" -gt "$MASK_MAX_TODO_BLOCKS" ] || [ "$block_words" -gt "$MASK_MAX_TODO_BLOCKS" ]; then
            echo "::error::todo_start()/todo_end() present (${todo_blocks} call site(s), ${block_words} identifier(s) outside comments). The block form masks an unbounded run of assertions and is banned here — use todo('why', <n>) with an explicit count."
            grep -E '^BLOCK' "$mask_out" | awk -F'\t' '{ printf "  %s:%s  %s\n", $2, $3, $5 }' || true
            grep -niE '\btodo_(start|end)\b' supabase/tests/*.sql || true
            exit 1
          fi

          # Static guard 3 — skip() is invisible to EVERY other guard in this
          # step: skipped assertions still count toward Tests= (so the
          # ran-vs-planned check passes) and can never fail. The suite must not
          # skip. Both the call sites and the bare identifier are banned, so
          # "skip\n(...)" and "skip/*c*/(...)" have nowhere to hide.
          if [ "$skip_calls" -gt "$MASK_MAX_SKIP_CALLS" ] || [ "$skip_words" -gt "$MASK_MAX_SKIP_CALLS" ]; then
            echo "::error::skip() present (${skip_calls} call site(s), ${skip_words} identifier(s) outside comments) — skipped assertions still count as run and can never fail. If this is prose, move it into a comment."
            grep -E '^CALL' "$mask_out" | awk -F'\t' '$4 == "skip" { printf "  %s:%s  %s\n", $2, $3, $6 }' || true
            grep -niE '\bskip\b' supabase/tests/*.sql || true
            exit 1
          fi

          # Static guard 4 — call-count ratchet. A todo() wrapped around an
          # assertion that currently PASSES emits no runtime marker at all, so
          # the runtime guard above cannot see it being added.
          if [ "$todo_calls" -gt "$MASK_MAX_TODO_CALLS" ]; then
            echo "::error::${todo_calls} todo() calls in the suite, ratchet is $MASK_MAX_TODO_CALLS — a new expected-fail marker was added without lowering coverage debt."
            grep -E '^CALL' "$mask_out" | awk -F'\t' '$4 == "todo" { printf "  %s:%s  %s\n", $2, $3, $6 }' || true
            exit 1
          fi

          # Static guard 5 — THE one that matters. Bounds how many ASSERTIONS
          # the suite is allowed to mask, not how many times it says the word.
          if [ "$masked_assertions" -gt "$MASK_MAX_MASKED_ASSERTIONS" ]; then
            echo "::error::todo() masks ${masked_assertions} assertions in total, ratchet is $MASK_MAX_MASKED_ASSERTIONS — the second argument of todo(why, how_many) was widened. Masking N assertions is exactly as serious as adding N todo() calls; the call count staying flat is not a defence."
            grep -E '^CALL' "$mask_out" | awk -F'\t' '$4 == "todo" { printf "  %s:%s  masks %s  %s\n", $2, $3, $5, $6 }' || true
            exit 1
          fi

          # Static guard 6 — formatting-immune. Outside comments and string
          # literals there is exactly one reason to write the identifier `todo`,
          # and that is to call it; so the identifier count may not exceed the
          # call ratchet. This is what catches a call whose "(" the parser above
          # could not associate with the name:
          #     SELECT todo            SELECT todo/*c*/('X', 20);
          #     ('X', 20);             SELECT "todo"('X', 20);
          # all of which are legal SQL and all of which defeat every
          # name-immediately-followed-by-paren rule, grep included. If this ever
          # fires on prose, the prose belongs in a -- comment (comments and
          # string bodies are stripped before counting, so they cost nothing).
          #
          # BOTH comparisons are required, and the second is the load-bearing
          # one. Against the CONSTANT alone this guard only catches a detached
          # call that is ADDED; CONVERTING an existing single-line call into a
          # detached one holds the word count flat while dropping the call out
          # of the masked-assertion sum entirely — so
          #     SELECT todo('F-2 ...', 1);   ->   SELECT todo\n('F-2 ...', 20);
          # scored todo_calls=1 masked=1 todo_words=2 and went green while
          # actually masking 21 assertions. Same for "todo"( , todo/*c*/( and
          # todo<CR>( . Against todo_calls, every `todo` in the tree must have a
          # call site the parser recognised and therefore counted, so guard 5's
          # sum is over ALL of them and the conversion has nowhere to land.
          if [ "$todo_words" -gt "$MASK_MAX_TODO_CALLS" ] || [ "$todo_words" -gt "$todo_calls" ]; then
            echo "::error::${todo_words} \`todo\` identifiers outside comments/strings but only ${todo_calls} recognised todo() call site(s), ratchet is $MASK_MAX_TODO_CALLS. Something writes the name without a directly-attached '(' — a newline, a /* */, or a quoted identifier between the two. Write masking calls as a single unbroken todo('why', <n>)."
            grep -niE '\btodo\b' supabase/tests/*.sql || true
            exit 1
          fi

          # Independent, parser-free tripwires. The same bans expressed a second
          # way, so a bug in the scanner above cannot silently let a mask
          # through. Both dimensions the original greps missed are fixed here:
          #   -i          — SQL is case-insensitive, grep is not ("select TODO(")
          #   [[:space:]]* — "SELECT todo ('X', 1)" is a legal call
          # \btodo[[:space:]]*\( does NOT match todo_start( : there, "todo" is
          # followed by "_", which is neither space nor "(" — so the todo rule
          # and the todo_start rule never double-report the same line.
          # These remain deliberately blunt textual checks: they would also fire
          # on the string "skip(" in a comment or an identifier. A false positive
          # is a cheap, obvious fix; a missed skip() is silent.
          todo_src=$(grep -hoiE '\btodo[[:space:]]*\(' supabase/tests/*.sql 2>/dev/null | wc -l | tr -d ' ')
          todo_src=${todo_src:-0}
          if [ "$todo_src" -gt "$MASK_MAX_TODO_CALLS" ]; then
            echo "::error::grep tripwire: $todo_src todo() calls in the suite, ratchet is $MASK_MAX_TODO_CALLS."
            grep -niE '\btodo[[:space:]]*\(' supabase/tests/*.sql || true
            exit 1
          fi
          if grep -niE '\bskip[[:space:]]*\(' supabase/tests/*.sql; then
            echo "::error::grep tripwire: skip() found in the suite — skipped assertions still count as run and can never fail."
            exit 1
          fi
          if grep -niE '\btodo_(start|end)[[:space:]]*\(' supabase/tests/*.sql; then
            echo "::error::grep tripwire: todo_start()/todo_end() found — the block form masks an unbounded run of assertions and is banned."
            exit 1
          fi

          # Ratchets are CEILINGS. Removing a todo() (because the underlying
          # finding was fixed) leaves the gate green with the ratchet untouched;
          # it shows up as a drop in the numbers on this line. Lowering the
          # constant afterwards is a deliberate, separate, reviewed act — never
          # automatic, and never in the same breath as raising another one.
          echo "masking gate OK: todo() calls=$todo_calls (max $MASK_MAX_TODO_CALLS), assertions masked by todo()=$masked_assertions (max $MASK_MAX_MASKED_ASSERTIONS), skip() calls=$skip_calls (max $MASK_MAX_SKIP_CALLS), todo_start/todo_end=$todo_blocks (max $MASK_MAX_TODO_BLOCKS), unparseable masks=$unparseable (max 0), failing-but-TODO at runtime=${todo_fail:-0} (max $MASK_MAX_TODO_FAILURES); identifiers outside comments: todo=$todo_words skip=$skip_words todo_start/end=$block_words"
          # >>> MASK-GATE-END

  # ---------------------------------------------------------------------------
  # web: build the Next.js app in web/. Runs only when web/package.json exists.
  # web/ pins Node >=22 (engines), so this job uses Node 22 even though the
  # mobile quality job uses Node 20. Vendored @snatchit/* tarballs live in
  # web/vendor/ and resolve from the committed lockfile.
  # ---------------------------------------------------------------------------
  web:
    name: Web build (Next.js)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # NOTE: a job-level `if: hashFiles(...)` is invalid (hashFiles is a
    # step-level function) and made GitHub reject this ENTIRE workflow at
    # startup (0s "workflow file issue", zero jobs, every event) — the reason
    # CI never ran during Phase 0. The job now always starts and its steps
    # skip when web/ is absent on the ref.
    defaults:
      run:
        working-directory: web
    steps:
      - name: Checkout
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0

      - name: Detect web app
        id: detect
        working-directory: .
        run: echo "exists=$([ -f web/package.json ] && echo yes || echo no)" >> "$GITHUB_OUTPUT"

      - name: Setup Node
        if: steps.detect.outputs.exists == 'yes'
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install (clean, from lockfile)
        if: steps.detect.outputs.exists == 'yes'
        run: npm ci

      - name: Build
        if: steps.detect.outputs.exists == 'yes'
        # The web app fails closed without these (by design — see web/src/lib/env).
        # CI compiles with well-formed public placeholders; the artifact is
        # discarded, never deployed (Vercel builds with real env separately).
        # NEXT_PUBLIC_* values are public-by-definition; no secrets here.
        env:
          NEXT_PUBLIC_SUPABASE_URL: https://ci-placeholder.supabase.co
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ci-placeholder-anon-key
          NEXT_PUBLIC_SITE_URL: https://ci-placeholder.snatchitapp.com
        run: npm run build
